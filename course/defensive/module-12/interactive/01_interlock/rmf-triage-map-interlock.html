<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light only">
<title>NIST AI RMF · Interactive Triage</title>
<style>
:root{
  --ink:#171821;--muted:#626675;--soft:#6B7080;--line:#e5e6ec;
  --paper:#f8f8fa;--white:#fff;--violet:#57068c;--violet2:#7d34ad;
  --violet-soft:#f4eef8;--red:#cb3d49;--red-dark:#962936;--red-soft:#fff0f1;
  --green:#14754b;--green-soft:#edf8f2;--teal:#207a78;--teal-soft:#eaf7f6;
  --amber:#bb7100;--amber-soft:#fff6e4;--navy:#27324a;
  --sans:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  --shadow:0 20px 58px rgba(34,23,43,.09);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{padding:0}
button{font:inherit}
.module{width:100%;margin:0 auto}
.heading{padding:8px 12px 12px}
.eyebrow{margin:0 0 7px;color:var(--violet);font:700 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase}
h1{margin:0;font-size:clamp(23px,3vw,35px);line-height:1.08;letter-spacing:-.035em}
.frame{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:0;background:#fff;box-shadow:none;border-left:0;border-right:0}
.scene-scroll{overflow:hidden}
.scene{display:block;width:100%;height:auto;min-height:520px}
.toolbar{display:flex;align-items:center;gap:12px;min-height:74px;padding:14px 18px;border-top:1px solid var(--line);background:rgba(255,255,255,.96)}
.actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap;flex:0 0 auto}
.button{min-height:42px;padding:0 18px;border:1px solid transparent;border-radius:11px;cursor:pointer;font-size:13px;font-weight:750;transition:transform .16s ease,background .16s ease,border-color .16s ease,opacity .16s ease}
.button:hover:not(:disabled){transform:translateY(-1px)}
.button:active:not(:disabled){transform:translateY(0) scale(.98)}
.button:focus-visible{outline:3px solid #ffbd45;outline-offset:2px}
.button.primary{background:var(--violet);color:#fff;box-shadow:0 7px 18px rgba(87,6,140,.18)}
.button.primary:hover:not(:disabled){background:var(--violet2)}
.button.secondary{background:#fff;color:var(--ink);border-color:#d7d9e1}
.button.secondary:hover:not(:disabled){border-color:#9fa3af;background:#fafafd}
.button[hidden]{display:none}.button:disabled{cursor:default;opacity:.68}
.insight{display:flex;align-items:flex-start;gap:11px;margin-left:auto;max-width:610px;color:var(--muted);font-size:13px;line-height:1.46}
.insight-mark{width:9px;height:9px;margin-top:5px;border-radius:50%;background:var(--violet);box-shadow:0 0 0 5px var(--violet-soft);flex:0 0 auto;transition:.2s}
.insight strong{color:var(--ink)}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}

.svg-kicker{font:700 12px/1 var(--mono);letter-spacing:.12em;fill:var(--soft)}
.svg-label{font:700 12px/1 var(--sans);fill:var(--ink)}
.svg-micro{font:650 12px/1 var(--mono);letter-spacing:.045em;fill:var(--muted)}
.scene-layer{transition:opacity .3s ease}
.station-top{fill:#fff;stroke:#bda4cf;stroke-width:1.3;transition:fill .18s ease,stroke .18s ease}
.station-left{fill:#eee5f3;stroke:#bda4cf;stroke-width:1.1}
.station-right{fill:#dfcce9;stroke:#bda4cf;stroke-width:1.1}
.station.active .station-top{fill:#e9d8f2;stroke:#7d34ad}
.evidence-card{fill:#fff;stroke:#d7d9e1;stroke-width:1.3}
.function-node{cursor:pointer;outline:none}
.function-node .focus-ring{fill:none;stroke:#ffbd45;stroke-width:0;opacity:0;transition:.15s}
.function-node:hover .focus-ring,.function-node:focus .focus-ring{stroke-width:3;opacity:1}
.gear-spin{transform-box:fill-box;transform-origin:center;animation:gearCW 16s linear infinite}
.gear-spin.ccw{animation-name:gearCCW;animation-duration:18s}
.link-pulse{filter:drop-shadow(0 2px 3px rgba(87,6,140,.28))}
.explainer-a{transform-box:fill-box;transform-origin:center bottom;animation:explainNod 2.2s ease-in-out infinite}
.explainer-b{transform-box:fill-box;transform-origin:center bottom;animation:explainNod 2.2s .8s ease-in-out infinite}
.talk-bubble{opacity:0;animation:talkBubble 4.8s ease-in-out infinite}
.talk-b{animation-delay:1.6s}.talk-c{animation-delay:3.2s}
@keyframes gearCW{to{transform:rotate(360deg)}}
@keyframes gearCCW{to{transform:rotate(-360deg)}}
@keyframes explainNod{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(1px) rotate(-1.5deg)}}
@keyframes talkBubble{0%,32%{opacity:1}35%,100%{opacity:0}}

@media(max-width:780px){
  body{padding:0}.heading{padding:7px 3px 14px}.frame{border-radius:0}
  .scene-scroll{overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin;scrollbar-color:var(--violet2) var(--violet-soft)}
  .scene-scroll::-webkit-scrollbar{height:10px}
  .scene-scroll::-webkit-scrollbar-track{margin:0 12px;border-radius:999px;background:var(--violet-soft)}
  .scene-scroll::-webkit-scrollbar-thumb{border:2px solid var(--violet-soft);border-radius:999px;background:var(--violet2)}
  .scene-scroll::-webkit-scrollbar-thumb:hover{background:var(--violet)}
  .scene{width:780px;max-width:none;min-height:0}
  .toolbar{align-items:stretch;flex-direction:column;padding:13px}.actions{width:100%}.button{flex:1 1 auto}.insight{margin:3px 3px 2px;max-width:none}
}
@media(max-width:520px){h1{font-size:23px}.button{width:100%;flex-basis:100%}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.link-pulse{display:none}.talk-bubble{opacity:1!important}}
</style>
</head>
<body>
<main class="module">
  <header class="heading">
    <p class="eyebrow">NIST AI RMF · Interactive Triage</p>
    <h1>Mapping the triage pipeline</h1>
  </header>

  <section class="frame" aria-labelledby="scene-title">
    <h2 id="scene-title" class="sr-only">Interactive Map assessment of an LLM-assisted alert triage pipeline</h2>
    <div class="scene-scroll" tabindex="0" aria-label="Interactive visual; scroll horizontally on small screens">
    <svg id="scene" class="scene" viewBox="0 0 1000 590" role="img" aria-labelledby="svg-title svg-desc">
      <title id="svg-title">A guided AI RMF Map assessment of a security alert triage pipeline.</title>
      <desc id="svg-desc">A Critical alert moves through parse, severity classification, enrichment, and analyst handoff, but is incorrectly routed into the Low queue. The assessment asks who uses the output and who is affected, scans for documentary evidence, grades the deployment Partial, constructs a one-page system context record, and ends with Govern, Map, Measure, and Manage shown as interlocking functions rather than sequential steps.</desc>
      <defs>
        <pattern id="dotGrid" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#e9e5ed"/></pattern>
        <linearGradient id="belt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfafc"/><stop offset="1" stop-color="#eee9f1"/></linearGradient>

        <linearGradient id="docGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f2edf5"/></linearGradient>
        <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#2b1736" flood-opacity=".13"/></filter>

        <g transform="translate(700 205)">

<script>
(function(){
  "use strict";
  var reduced=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var primary=document.getElementById("primary"),replay=document.getElementById("replay"),live=document.getElementById("live"),insight=document.getElementById("insight"),sceneScroll=document.querySelector(".scene-scroll");
  var pipeline=document.getElementById("pipelineScene"),evidence=document.getElementById("evidenceScene"),grade=document.getElementById("gradeScene"),record=document.getElementById("recordScene"),interlock=document.getElementById("interlockScene");
  var alertToken=document.getElementById("alertToken"),state=0,runToken=0,alertPos={x:92,y:278};
  var colors={violet:"#57068c",red:"#cb3d49",green:"#14754b",teal:"#207a78",amber:"#bb7100"};

  function text(id,value){document.getElementById(id).textContent=value;}
  function opacity(id,value){document.getElementById(id).setAttribute("opacity",String(value));}
  function show(el,on){el.hidden=!on;}

  function animate(duration,draw,token){return new Promise(function(resolve){if(reduced||duration===0){draw(1);resolve();return;}var t0=null;function frame(ts){if(token!==runToken){resolve();return;}if(t0===null)t0=ts;var p=Math.min(1,(ts-t0)/duration);draw(p);if(p<1)requestAnimationFrame(frame);else resolve();}requestAnimationFrame(frame);});}
  function setInsight(html,color){insight.querySelector("span:last-child").innerHTML=html;var m=insight.querySelector(".insight-mark");m.style.background=color;m.style.boxShadow="0 0 0 5px "+(color===colors.red?"#fff0f1":color===colors.green?"#edf8f2":color===colors.teal?"#eaf7f6":color===colors.amber?"#fff6e4":"#f4eef8");}

  function gearPath(outer,root,teeth){var points=[],steps=teeth*4;for(var i=0;i<steps;i++){var a=-Math.PI/2+i*Math.PI*2/steps;var phase=i%4;var r=(phase===1||phase===2)?outer:root;points.push((i?"L":"M")+(Math.cos(a)*r).toFixed(2)+" "+(Math.sin(a)*r).toFixed(2));}return points.join(" ")+" Z";}
  var gearD=gearPath(96,86,16);["gearGovernPath","gearMapPath","gearMeasurePath","gearManagePath"].forEach(function(id){document.getElementById(id).setAttribute("d",gearD);});

    runToken++;state=0;

    opacity("questionCards",0);opacity("delayClock",0);opacity("alertToken",0);setAlert(92,278);

    opacity("informalCard",0);opacity("durableCard",0);opacity("gradeConsequences",0);document.getElementById("gradeArc").setAttribute("stroke-dashoffset","590.62");

    announce("Worked example reset. The alert triage pipeline is ready to map.");
  }

  async function mapPipeline(){
    if(state!==0)return;state=-1;var token=++runToken;primary.disabled=true;setStep("1 / 5 · GUIDING QUESTIONS",colors.violet);

    await fadeIn("questionCards",420,token);if(token!==runToken)return;
    state=1;primary.disabled=false;primary.textContent="2 · Hunt for evidence";
    setInsight("<strong>The output allocates attention.</strong> A Critical alert mislabeled Low can delay response; analysts and users absorb the consequence.",colors.red);
    announce("The Critical alert was classified Low and placed in the waiting queue. Map identifies analyst attention, response delay, analysts, and users.");
  }

  async function huntEvidence(){
    if(state!==1)return;state=-1;var token=++runToken;primary.disabled=true;setStep("2 / 5 · EVIDENCE HUNT",colors.red);await fadeScenes(pipeline,evidence,token);opacity("scanner",1);

    opacity("scanner",0);await fadeIn("evidenceSummary",320,token);if(token!==runToken)return;
    state=2;primary.disabled=false;primary.textContent="3 · Grade it";
    setInsight("<strong>The deployment has facts, but almost no durable evidence.</strong> The purchase record exists; consequence analysis, affected-party mapping, and a drift-review owner do not.",colors.red);
    announce("Evidence scan complete. One artifact was found and three were missing.");
  }

  async function gradeIt(){
    if(state!==2)return;state=-1;var token=++runToken;primary.disabled=true;setStep("3 / 5 · GRADE",colors.amber);await fadeScenes(evidence,grade,token);await fadeIn("informalCard",260,token);await fadeIn("durableCard",260,token);

    announce("The assessment grade is Partial because informal understanding exists without durable, auditable evidence.");
  }

  async function nameArtifact(){
    if(state!==3)return;state=-1;var token=++runToken;primary.disabled=true;setStep("4 / 5 · RECOMMEND",colors.green);await fadeScenes(grade,record,token);var rows=Array.prototype.slice.call(document.querySelectorAll(".record-row"));for(var i=0;i<rows.length;i++){await animate(220,function(raw){rows[i].setAttribute("opacity",String(raw));},token);await wait(55);}await fadeIn("artifactStamp",340,token);if(token!==runToken)return;
    state=4;primary.disabled=false;primary.textContent="5 · Reveal the interlock";
    setInsight("<strong>Name the artifact, not the aspiration.</strong> A one-page system context record makes purpose, consequences, affected parties, ownership, and review triggers durable.",colors.green);
    announce("The recommendation is a named one-page system context record with six specific fields.");
  }

  async function revealInterlock(){
    if(state!==4)return;state=-1;var token=++runToken;primary.disabled=true;setStep("5 / 5 · INTERLOCK",colors.teal);await fadeScenes(record,interlock,token);if(token!==runToken)return;
    if(sceneScroll.scrollWidth>sceneScroll.clientWidth)sceneScroll.scrollTo({left:(sceneScroll.scrollWidth-sceneScroll.clientWidth)/2,behavior:reduced?"auto":"smooth"});
    state=5;show(primary,false);show(replay,true);
    setInsight("<strong>The four functions interlock rather than run in sequence.</strong> When Map finds no document or owner, that finding also exposes a Govern gap; Measure and Manage depend on the same context and accountability.",colors.teal);
    announce("Final takeaway: Govern, Map, Measure, and Manage interlock rather than run in sequence. A Map finding of no owner or record also reveals a Govern gap.");
  }

  var functionCopy={
    govern:"GOVERN CREATES THE CONDITIONS · owners, policies, review records, accountability",
    map:"MAP ESTABLISHES CONTEXT · decisions, consequences, affected parties, and intended use",
    measure:"MEASURE TESTS THE CLAIMS · error patterns, severity drift, and monitoring evidence",
    manage:"MANAGE ACTS ON RISK · prioritize, mitigate, accept, communicate, and reassess"
  };
  Array.prototype.forEach.call(document.querySelectorAll(".function-node"),function(node){var key=node.getAttribute("data-function");function activate(){if(state===5)text("functionInfo",functionCopy[key]);}node.addEventListener("mouseenter",activate);node.addEventListener("focus",activate);node.addEventListener("click",activate);});
  primary.addEventListener("click",function(){if(state===0)mapPipeline();else if(state===1)huntEvidence();else if(state===2)gradeIt();else if(state===3)nameArtifact();else if(state===4)revealInterlock();});
  replay.addEventListener("click",reset);
  reset();
})();

/* ── Pill auto-fit ────────────────────────────────────────────────
   The pill backgrounds in this diagram are hand-sized SVG rects. Raising the
   label type to the 12px legibility floor made several labels wider than the
   rect drawn behind them, so white pill text spilled onto the near-white card
   and became unreadable. Measure each label after layout and widen its pill to
   match, keeping the pill centred where it was. Runs again on resize because
   getBBox depends on the rendered font. */
function fitPills(){
  document.querySelectorAll('svg g').forEach(function(g){
    var rect = g.querySelector(':scope > rect');
    var text = g.querySelector(':scope > text');
    if(!rect || !text) return;
    var bb;
    try { bb = text.getBBox(); } catch(e){ return; }
    if(!bb || !bb.width) return;
    var pad = 12;
    var need = Math.ceil(bb.width + pad * 2);
    var cur  = parseFloat(rect.getAttribute('width')) || 0;
    if(!cur || need <= cur) return;
    var x = parseFloat(rect.getAttribute('x')) || 0;
    var cx = x + cur / 2;
    rect.setAttribute('width', need);
    rect.setAttribute('x', cx - need / 2);
  });
}
if(document.fonts && document.fonts.ready){ document.fonts.ready.then(fitPills); }
window.addEventListener('load', function(){ setTimeout(fitPills, 60); });
window.addEventListener('resize', function(){ setTimeout(fitPills, 60); });

/* ── Report height to the parent page ──────────────────────────────
   Four of this module's five interactives never told the parent iframe how
   tall they were, so the frame stayed at the fixed height declared in the
   module page and anything taller was silently cut off. That is the clipped
   bottom line the first-round review reported in the ADOPTED tab: the panel
   grows to 557px there against a 520px frame. ResizeObserver covers content
   that changes after load, such as switching tabs. */
(function(){
  var _lastH = 0;
  function sendHeight(){
    /* Measure the content element, not documentElement. Once the parent has
       sized the iframe to a reported height, documentElement.scrollHeight is
       pinned to that height, so it can never report that the content now wants
       to be taller. Switching to the ADOPTED tab grows the panel past the
       frame, and measuring the wrapper is what notices. */
    var el = document.querySelector('.wrap, main.module, .card') || document.body;
    var cs = getComputedStyle(document.body);
    var pad = (parseFloat(cs.paddingTop)||0) + (parseFloat(cs.paddingBottom)||0);
    var h = Math.ceil(el.getBoundingClientRect().height + pad + 4);
    if(h === _lastH) return;
    _lastH = h;
    if(window.parent!==window && h>50){
      window.parent.postMessage({kind:"nyu-embed-height",height:h},"*");
    }
  }
  if("ResizeObserver" in window){
    var _obs=new ResizeObserver(sendHeight);_obs.observe(document.documentElement);
    var _t=document.querySelector(".wrap, main.module, .card"); if(_t) _obs.observe(_t);
  }
  /* Poll as well. ResizeObserver did not fire for the panel growth caused by
     switching to the ADOPTED tab, so the frame stayed at its loaded height and
     clipped the last line. sendHeight only posts when the number actually
     changes, so this costs one measurement per tick and no messages at rest. */
  setInterval(sendHeight, 600);
  window.addEventListener("load",function(){sendHeight();setTimeout(sendHeight,300);setTimeout(sendHeight,1000);});
})();
</script>

<script>
/* Frame height, reported for the life of the page (nyu-embed-height-observer).
   The per-interactive height post usually fires only when the canvas resizes,
   so text growing below the canvas never re-posts. Measure content, not the
   viewport: the parent sizes the frame from this number, and measuring the
   viewport would feed back and grow the frame on every message. */
(function () {
  var last = 0;
  function contentHeight() {
    var kids = document.body.children, max = 0;
    for (var i = 0; i < kids.length; i++) {
      var r = kids[i].getBoundingClientRect();
      if (r.height) { max = Math.max(max, r.bottom + window.scrollY); }
    }
    if (!max) { return 0; }
    var pb = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    return Math.ceil(max + pb + 16);
  }
  function post() {
    var h = contentHeight();
    if (!h || Math.abs(h - last) < 3) { return; }
    last = h;
    try {
      parent.postMessage({ kind: 'nyu-embed-height', height: h, src: location.href }, '*');
    } catch (e) { /* not embedded, or a cross-origin parent */ }
  }
  if (window.ResizeObserver) {
    var ro = new ResizeObserver(post);
    ro.observe(document.body);
    for (var i = 0; i < document.body.children.length; i++) { ro.observe(document.body.children[i]); }
  }
  /* Safari settles webfonts after first layout, which is the case that broke. */
  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(post); }
  window.addEventListener('load', post);
  [60, 250, 700, 1500].forEach(function (t) { setTimeout(post, t); });
  /* Reveals and step buttons change height without resizing the canvas. */
  document.addEventListener('click', function () { setTimeout(post, 450); }, true);
})();
</script>
