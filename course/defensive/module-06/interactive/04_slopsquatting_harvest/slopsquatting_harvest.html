<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attack Chain Comparison</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--v:#57068C;--v-d:#3D0461;--v50:#F5EDFA;--v100:#E8D8F2;--v200:#D2B3E5;--red:#C42A2A;--red-bg:#FBE8E8;--grn:#166B3A;--grn-bg:#E6F4EC;--amb:#8A5D00;--amb-bg:#FCF1DC;--ink:#1A1A1A;--ink2:#6B6B6B;--rule:#E2E2E2;--sf:#FFF;--sk:#F6F4F8;--sans:"Open Sans",sans-serif}
*{box-sizing:border-box;margin:0}
body{font-family:var(--sans);color:var(--ink);background:var(--sk);padding:10px 12px}
.w{max-width:880px;margin:0 auto}
.card{background:var(--sf);border:1px solid var(--rule);border-radius:14px;box-shadow:0 10px 30px rgba(18,22,33,.06);overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:14px 18px;flex-wrap:wrap}
.top h1{font-size:.92rem;font-weight:700;letter-spacing:-.02em;flex:1 1 auto;min-width:160px}
.badge{font-size:.7rem;font-weight:700;color:#fff;background:#4C1D95;border:1.5px solid var(--v200);border-radius:8px;padding:4px 12px;white-space:nowrap}
.body-wrap{padding:0 18px 16px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.tab{font-family:"Open Sans",sans-serif;font-size:.68rem;font-weight:600;border:none;border-radius:7px;padding:5px 10px;cursor:pointer;transition:background .15s,color .15s;background:transparent;color:var(--ink2)}
.tab:hover:not(.active){background:var(--v50)}
.tab.active{background:var(--v);color:#fff}
.tab:focus-visible{outline:2px solid var(--v);outline-offset:2px}
canvas{display:block;width:100%;border-radius:10px;touch-action:manipulation}
.stats{display:flex;flex-direction:column;gap:5px;margin-top:8px;padding:8px 12px;background:var(--sk);border-radius:8px}
.stat{display:flex;align-items:center;gap:6px;font-size:.72rem;line-height:1.3}
.stat-lbl{color:var(--ink2);font-weight:600;min-width:105px;flex-shrink:0}
.stat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-none,.dot-low{background:#166B3A}
.dot-none{box-shadow:0 0 6px rgba(22,107,58,0.4)}
.dot-med{background:#8A5D00}
.dot-high{background:#C42A2A}
.stat-val{color:var(--ink);font-weight:400}
.new-tag{font-size:.6rem;font-weight:700;color:#fff;background:#991B1B;padding:1px 6px;border-radius:4px;margin-left:4px}
.insight{margin-top:8px;padding:10px 14px;border-radius:8px;font-size:.73rem;line-height:1.55;border:1.5px solid;opacity:0;transition:opacity .3s;overflow:hidden;max-height:0}
.insight.show{opacity:1;max-height:200px}
.insight.t-info{background:var(--v50);border-color:var(--v200);color:#1A1A1A}
.insight.t-warn{background:var(--red-bg);border-color:var(--red);color:#1A1A1A}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="w">
<div class="card">
  <div class="top">
    <h1>Attack Chain Comparison</h1>
  </div>
  <div class="body-wrap">
    <div class="tabs" id="tabs" role="tablist" aria-label="Supply chain attack vectors">
      <button class="tab" role="tab" aria-selected="false" data-i="0">Dep. Confusion</button>
      <button class="tab" role="tab" aria-selected="false" data-i="1">Typosquatting</button>
      <button class="tab" role="tab" aria-selected="false" data-i="2">Maintainer</button>
      <button class="tab" role="tab" aria-selected="false" data-i="3">Build System</button>
      <button class="tab active" role="tab" aria-selected="true" data-i="4">Slopsquatting</button>
    </div>
    <canvas id="cv" role="img" aria-label="Attack chain diagram showing attacker steps, trust boundary crossing, and victim impact for the selected supply chain attack vector."></canvas>
    <div class="stats" id="stats">
      <div class="stat">
        <span class="stat-lbl">Attacker barrier</span>
        <span class="stat-dot" id="dotB"></span>
        <span class="stat-val" id="valB"></span>
      </div>
      <div class="stat">
        <span class="stat-lbl">Victim action</span>
        <span class="stat-val" id="valV"></span>
      </div>
      <div class="stat">
        <span class="stat-lbl">Trust boundary</span>
        <span class="stat-val" id="valT"></span>
      </div>
    </div>
    <div class="insight" id="ins" aria-live="polite"></div>
  </div>
</div>
</div>

<script>
(function(){
'use strict';

var SANS='"Open Sans",sans-serif';
var BG='#0D0B1A';
var TEXT='#D4CEE0';


var VECTORS=[
  {
    name:'Dependency Confusion',
    steps:[
      'Discover internal\npackage names',
      'Publish matching name\non public registry',
      'Package manager\nresolves to public',
      'Build auto-pulls\nmalicious code'
    ],
    barrier:'med', barrierText:'Must find internal package names',
    victim:'Build system lacks registry scoping',
    boundary:'Developer → Registry', newBound:false,
    accent:'#FF8060',
    insight:'No typo needed - the build system makes the wrong choice automatically. Requires prior recon to discover internal package names from leaked configs or public repos.'
  },
  {
    name:'Typosquatting',
    steps:[
      'Register packages\nfor common typos',
      'Include real code\nplus hidden payload',
      'Developer mistypes\npackage name',
      'pip install pulls\nattacker package'
    ],
    barrier:'low', barrierText:'Predict common typos of popular packages',
    victim:'Types wrong package name',
    boundary:'Developer → Registry', newBound:false,
    accent:'#FFA040',
    insight:'Depends on a human typing error. Automated detection exists but false positives are common since legitimate packages can have similar names.'
  },
  {
    name:'Maintainer Compromise',
    steps:[
      'Build trust with\nmaintainer (weeks)',
      'Gain package\npublish access',
      'Push update with\nobfuscated payload',
      'Dependents auto-\nupdate to malicious'
    ],
    barrier:'high', barrierText:'Weeks/months of social engineering',
    victim:'None - trusted update channel',
    boundary:'Developer → Maintainer', newBound:false,
    accent:'#60A0FF',
    insight:'Highest effort but hardest to detect. The event-stream compromise ran about two and a half months. The victim does nothing wrong - updates arrive through the normal trusted channel.'
  },
  {
    name:'Build System Compromise',
    steps:[
      'Compromise CI/CD\ncredentials or infra',
      'Modify build scripts\nor helper tools',
      'Tampered artifacts\nbuilt and distributed',
      'Users install via\ntrusted channel'
    ],
    barrier:'high', barrierText:'Access to build infrastructure or credentials',
    victim:'None - trusted distribution channel',
    boundary:'Build System → Source', newBound:false,
    accent:'#40C8B0',
    insight:'Codecov ran undetected for 2 months. 3CX was the first documented case of one supply chain attack used as the entry vector for a second.'
  },
  {
    name:'Slopsquatting',
    steps:[
      'Prompt LLMs, collect\nhallucinated names',
      'Register names on\npublic registry',
      'AI coding assistant\nsuggests the name',
      'Developer installs\nattacker package'
    ],
    barrier:'none', barrierText:'None - just prompt any LLM',
    victim:'Follows AI recommendation without verifying',
    boundary:'Developer → AI → Registry', newBound:true,
    accent:'#C080FF',
    insight:'Lowest barrier of all five vectors. LLMs hallucinate the same package names ~43% of the time. Introduces a trust boundary (Developer to AI) that did not exist before AI-assisted coding became widespread.'
  }
];

var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var insEl=document.getElementById('ins');
var dotB=document.getElementById('dotB');
var valB=document.getElementById('valB');
var valV=document.getElementById('valV');
var valT=document.getElementById('valT');
var tabEls=document.querySelectorAll('.tab');

var sel=4;
var animStart=performance.now();
var W,H,dpr;
var reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function resize(){
  var rect=cv.parentElement.getBoundingClientRect();
  dpr=window.devicePixelRatio||1;
  W=rect.width;
  H=96;
  cv.width=W*dpr;cv.height=H*dpr;
  cv.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  draw();
}

/* roundRect helper for older browsers */
function rrect(x,y,w,h,r){
  ctx.beginPath();
  if(ctx.roundRect){ctx.roundRect(x,y,w,h,r);}
  else{ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);}
}

function draw(){
  var v=VECTORS[sel];
  var now=performance.now();
  var elapsed=reducedMotion?9999:(now-animStart);

  ctx.clearRect(0,0,W,H);

  /* Background */
  ctx.fillStyle=BG;
  rrect(0,0,W,H,10);ctx.fill();

  /* Layout */
  var margin=Math.max(10,W*0.02);
  var gap=Math.max(18,W*0.028);
  var nodeW=Math.min(170,(W-2*margin-3*gap)/4);
  var nodeH=44;
  var labelH=16; /* zone label row + gap to nodes */
  var boundH=18; /* boundary label below nodes */
  var contentH=labelH+nodeH+boundH;
  var padY=(H-contentH)/2;
  var totalW=4*nodeW+3*gap;
  var startX=(W-totalW)/2;
  var nodeY=padY+labelH;

  /* Node x positions */
  var nx=[];
  for(var i=0;i<4;i++) nx.push(startX+i*(nodeW+gap));

  /* Boundary center x (between nodes 2 and 3) */
  var bcx=(nx[1]+nodeW+nx[2])/2;

  /* Zone backgrounds */
  var zt=padY,zb=nodeY+nodeH+2;
  ctx.fillStyle='rgba(255,80,80,0.04)';
  rrect(margin/2,zt,bcx-margin/2-1,zb-zt,6);ctx.fill();
  ctx.fillStyle='rgba(100,180,255,0.04)';
  rrect(bcx+1,zt,W-margin/2-bcx-1,zb-zt,6);ctx.fill();

  /* Zone labels */
  ctx.font='700 8px '+SANS;
  ctx.textBaseline='top';
  ctx.textAlign='left';
  ctx.fillStyle='#FF8080';
  ctx.fillText('ATTACKER SIDE',margin+2,zt);
  ctx.textAlign='right';
  ctx.fillStyle='#80B0FF';
  ctx.fillText('VICTIM SIDE',W-margin-2,zt);

  /* Boundary line */
  ctx.strokeStyle='rgba(255,80,80,0.5)';
  ctx.lineWidth=1;
  ctx.setLineDash([3,3]);
  ctx.beginPath();ctx.moveTo(bcx,zt+10);ctx.lineTo(bcx,zb);ctx.stroke();
  ctx.setLineDash([]);

  var stillAnim=false;

  /* Nodes */
  for(i=0;i<4;i++){
    var delay=i*120;
    var t=Math.max(0,Math.min(1,(elapsed-delay)/350));
    var et=1-Math.pow(1-t,3);
    if(t<1)stillAnim=true;

    ctx.globalAlpha=et;
    var x=nx[i];
    var slideOff=(1-et)*20;

    /* Node bg + border */
    ctx.fillStyle='rgba(180,170,210,0.08)';
    rrect(x-slideOff,nodeY,nodeW,nodeH,6);ctx.fill();
    ctx.strokeStyle=v.accent;
    ctx.lineWidth=1.5;
    ctx.stroke();

    /* Step number */
    ctx.font='700 7px '+SANS;
    ctx.textAlign='left';ctx.textBaseline='top';
    ctx.fillStyle=TEXT;
    ctx.fillText(String(i+1),x-slideOff+5,nodeY+3);

    /* Step text */
    var lines=v.steps[i].split('\n');
    ctx.font='600 '+(nodeW<130?'9':'10')+'px '+SANS;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle=TEXT;
    var cy=nodeY+nodeH/2+2;
    if(lines.length===1){
      ctx.fillText(lines[0],x-slideOff+nodeW/2,cy);
    }else{
      ctx.fillText(lines[0],x-slideOff+nodeW/2,cy-7);
      ctx.fillText(lines[1],x-slideOff+nodeW/2,cy+7);
    }
    ctx.globalAlpha=1;

    /* Arrow to next */
    if(i<3){
      var ad=(i+0.5)*120;
      var at2=Math.max(0,Math.min(1,(elapsed-ad)/250));
      if(at2<1)stillAnim=true;
      ctx.globalAlpha=at2;

      var ax1=x-slideOff+nodeW+2;
      var nextSlide=(1-Math.max(0,Math.min(1,(elapsed-(i+1)*120)/350)))*20;
      nextSlide=1-Math.pow(1-Math.max(0,Math.min(1,(elapsed-(i+1)*120)/350)),3);
      nextSlide=(1-nextSlide)*20;
      var ax2=nx[i+1]-nextSlide-2;
      var ay=nodeY+nodeH/2;

      ctx.strokeStyle='rgba(200,195,220,0.7)';
      ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(ax1,ay);ctx.lineTo(ax2-5,ay);ctx.stroke();

      ctx.fillStyle='rgba(200,195,220,0.7)';
      ctx.beginPath();
      ctx.moveTo(ax2,ay);
      ctx.lineTo(ax2-6,ay-3);
      ctx.lineTo(ax2-6,ay+3);
      ctx.closePath();ctx.fill();

      ctx.globalAlpha=1;
    }
  }

  /* Boundary label below chain */
  var bd=500;
  var bt2=Math.max(0,Math.min(1,(elapsed-bd)/300));
  if(bt2<1)stillAnim=true;
  ctx.globalAlpha=bt2;
  ctx.font='700 10px '+SANS;
  ctx.textAlign='center';ctx.textBaseline='top';
  ctx.fillStyle=v.newBound?'#FF6B6B':TEXT;
  var bly=zb+6;
  ctx.fillText(v.boundary+(v.newBound?' (NEW)':''),W/2,bly);
  ctx.globalAlpha=1;

  if(stillAnim)requestAnimationFrame(draw);
}

function updateStats(){
  var v=VECTORS[sel];
  /* Barrier dot */
  dotB.className='stat-dot dot-'+v.barrier;
  valB.textContent=v.barrierText;
  valV.textContent=v.victim;
  /* Trust boundary */
  if(v.newBound){
    valT.innerHTML=v.boundary+' <span class="new-tag">NEW</span>';
  }else{
    valT.textContent=v.boundary;
  }
}

function showInsight(){
  var v=VECTORS[sel];
  insEl.className='insight show t-'+(sel===4?'warn':'info');
  insEl.textContent=v.insight;
  setTimeout(sendHeight,50);
}

/* Tab handlers */
tabEls.forEach(function(tab){
  tab.addEventListener('click',function(){
    var idx=parseInt(tab.getAttribute('data-i'),10);
    if(idx===sel)return;
    sel=idx;
    animStart=performance.now();
    tabEls.forEach(function(t){
      t.classList.remove('active');
      t.setAttribute('aria-selected','false');
    });
    tab.classList.add('active');
    tab.setAttribute('aria-selected','true');
    updateStats();
    showInsight();
    requestAnimationFrame(draw);
  });
});

window.addEventListener('resize',resize);
resize();
updateStats();
showInsight();

/* iframe height */
function sendHeight(){
  var el=document.querySelector('.w');if(!el)return;
  var r=el.getBoundingClientRect();
  var pad=parseFloat(getComputedStyle(document.body).paddingTop)+parseFloat(getComputedStyle(document.body).paddingBottom);
  window.parent.postMessage({type:'iframeHeight',height:Math.ceil(r.height+pad),src:location.href},'*');
}
(function(){
  var root=document.documentElement,body=document.body;
  root.style.height='auto';body.style.height='auto';root.style.overflow='visible';body.style.overflow='visible';
  if(window.ResizeObserver){new ResizeObserver(sendHeight).observe(document.querySelector('.w')||body);}
  else setInterval(sendHeight,500);
  window.addEventListener('load',function(){setTimeout(sendHeight,200)});
  setTimeout(sendHeight,50);
})();
})();
</script>
</body>
</html>
