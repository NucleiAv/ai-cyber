<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Review Layer Gauntlet</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--v:#57068C;--v-d:#3D0461;--v50:#F5EDFA;--v100:#E8D8F2;--v200:#D2B3E5;--red:#C42A2A;--red-bg:#FBE8E8;--grn:#166B3A;--grn-bg:#E6F4EC;--amb:#8A5D00;--amb-bg:#FCF1DC;--ink:#1A1A1A;--ink2:#6B6B6B;--rule:#E2E2E2;--sf:#FFF;--sk:#F6F4F8;--mono:"JetBrains Mono",monospace;--sans:"Open Sans",sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--sk);color:var(--ink);padding:10px 12px;-webkit-font-smoothing:antialiased}

.w{max-width:680px;margin:0 auto}
.card{background:var(--sf);border-radius:10px;border:1px solid var(--rule);overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 10px;border-bottom:1px solid var(--rule)}
.top h1{font-size:15px;font-weight:700;color:var(--v-d);font-family:var(--sans)}
.tag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:#4C1D95;padding:3px 8px;border-radius:4px}
.body-wrap{padding:14px 16px 16px}

/* === GRID === */
.grid-area{overflow:hidden}
.grid-matrix{display:grid;grid-template-columns:100px repeat(4,1fr);grid-template-rows:auto auto auto auto;gap:6px;margin-bottom:14px}

.grid-corner{min-height:10px}

.grid-col-head{text-align:center;font-size:12px;font-weight:700;line-height:1.25;padding:6px 4px;border-radius:5px;color:var(--sf);background:var(--tool-color)}

.grid-row-head{display:flex;flex-direction:column;justify-content:center;padding:4px 6px;font-size:11px;font-weight:600;line-height:1.2;color:var(--ink)}
.row-sub{display:block;font-size:9px;font-weight:400;color:var(--ink2);margin-top:1px}

.grid-cell{min-height:44px;border-radius:5px;cursor:default;transition:box-shadow .2s,transform .15s}
.grid-cell.clickable{cursor:pointer}
.grid-cell.clickable:hover{transform:scale(1.04);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.grid-cell.active-cell{box-shadow:0 0 0 2px var(--v),0 2px 8px rgba(87,6,140,.25)}

.cell-inner{width:100%;height:100%;display:flex;align-items:center;justify-content:center;border-radius:5px;min-height:44px}

/* Pending */
.cell-pending{background:var(--sk);border:2px dashed var(--rule);border-radius:5px;width:100%;height:100%;min-height:44px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:var(--ink2);font-family:var(--mono)}

/* Scanning */
@keyframes cellScan{0%,100%{background:var(--sf)}50%{background:var(--scan-tint,#eee)}}
.cell-scanning .cell-inner{animation:cellScan .4s ease-in-out infinite;border-radius:5px}
.cell-scanning .cell-pending{border:none;background:transparent;color:transparent}

/* Revealed icons */
.cell-icon{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--sf);animation:iconPop .3s cubic-bezier(.34,1.56,.64,1) both;line-height:1}
@keyframes iconPop{0%{transform:scale(0);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}

.icon-caught{background:var(--grn-bg);border:2px solid var(--grn)}
.icon-caught::after{content:'';display:block;width:10px;height:6px;border-left:2.5px solid var(--grn);border-bottom:2.5px solid var(--grn);transform:rotate(-45deg) translate(1px,-1px)}

.icon-missed{background:var(--red-bg);border:2px solid var(--red)}
.icon-missed::before{content:'';display:block;width:12px;height:2.5px;background:var(--red);border-radius:1px;position:absolute;transform:rotate(45deg)}
.icon-missed::after{content:'';display:block;width:12px;height:2.5px;background:var(--red);border-radius:1px;position:absolute;transform:rotate(-45deg)}
.icon-missed{position:relative}

.icon-partial{background:#854D0E;border:2px solid var(--amb);font-family:var(--sans);font-weight:800;font-size:16px;color:#fff}
.icon-partial::after{content:'!'}

/* === ACTION ROW === */
.action-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.run-btn{font-family:var(--sans);font-size:12px;font-weight:700;color:var(--sf);background:var(--v);border:none;border-radius:6px;padding:8px 18px;cursor:pointer;transition:background .15s,transform .1s}
.run-btn:hover:not(:disabled){background:var(--v-d);transform:translateY(-1px)}
.run-btn:disabled{opacity:.55;cursor:not-allowed}
.run-hint{font-size:11px;color:var(--ink2)}

/* === DETAIL STRIP === */
.detail-strip{display:none;background:var(--sk);border-left:4px solid var(--v);border-radius:0 6px 6px 0;padding:10px 14px;margin-bottom:12px;font-size:11px;line-height:1.5}
.detail-strip.visible{display:block;animation:stripIn .25s ease-out}
@keyframes stripIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.detail-tool{font-weight:700;margin-bottom:2px}
.detail-how{color:var(--ink2);margin-bottom:4px}
.detail-reason{color:var(--ink);font-weight:600}

/* === SUMMARY === */
.summary{display:none;margin-bottom:12px}
.summary.visible{display:flex;flex-direction:column;gap:4px;animation:stripIn .3s ease-out}
.summary-line{font-size:11px;font-weight:600;padding:5px 10px;border-radius:4px;line-height:1.3}

/* === INSIGHT === */
.insight{font-size:11px;color:var(--ink2);line-height:1.5;padding:8px 10px;background:var(--v50);border-radius:5px;border-left:3px solid var(--v200);transition:all .3s}

/* === RESPONSIVE === */
@media(max-width:600px){
  .grid-matrix{grid-template-columns:1fr;gap:8px}
  .grid-corner{display:none}
  .grid-col-head{display:none}
  .grid-row-head{padding:6px 0 2px;font-size:12px}
  .grid-cell{position:relative}
  .grid-cell::before{content:attr(data-tool);position:absolute;top:2px;left:6px;font-size:8px;font-weight:700;color:var(--ink2);letter-spacing:.03em;text-transform:uppercase}
  .cell-inner{min-height:38px}
}

    /* Respect a reduced-motion preference: these loops are decorative idle
       cues, so switching them off costs the learner nothing. WCAG 2.2.2. */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
</style>
</head>
<body>

<div class="w">
  <div class="card">
    <div class="top"><h1>Review Layer Gauntlet</h1><span class="tag">Interactive</span></div>
    <div class="body-wrap">

      <div class="grid-area">
        <div class="grid-matrix">
          <div class="grid-corner"></div>
          <div class="grid-col-head" style="--tool-color:#1E40AF">Human<br>Reviewer</div>
          <div class="grid-col-head" style="--tool-color:#9A3412">Pattern<br>SAST</div>
          <div class="grid-col-head" style="--tool-color:#166534">Semantic<br>SAST</div>
          <div class="grid-col-head" style="--tool-color:#57068C">LLM<br>Review</div>

          <div class="grid-row-head">Profile Page<span class="row-sub">Direct innerHTML</span></div>
          <div class="grid-cell" id="c0r0" data-tool="Human" onclick="clickCell(0,0)"><div class="cell-inner"><div class="cell-pending">?</div></div></div>
          <div class="grid-cell" id="c1r0" data-tool="Pattern" onclick="clickCell(1,0)"><div class="cell-inner"><div class="cell-pending">?</div></div></div>
          <div class="grid-cell" id="c2r0" data-tool="Semantic" onclick="clickCell(2,0)"><div class="cell-inner"><div class="cell-pending">?</div></div></div>
          <div class="grid-cell" id="c3r0" data-tool="LLM" onclick="clickCell(3,0)"><div class="cell-inner"><div class="cell-pending">?</div></div></div>

          <div class="grid-row-head">Admin Dashboard<span class="row-sub">Template chain + privs</span></div>
          <div class="grid-cell" id="c0r1" data-tool="Human" onclick="clickCell(0,1)"><div class="cell-inner"><div class="cell-pending">?</div></div></div>
          <div class="grid-cell" id="c1r1" data-tool="Pattern" onclick="clickCell(1,1)"><div class="cell-inner"><div class="cell-pending">?</div></div></div>
          <div class="grid-cell" id="c2r1" data-tool="Semantic" onclick="clickCell(2,1)"><div class="cell-inner"><div class="cell-pending">?</div></div></div>
          <div class="grid-cell" id="c3r1" data-tool="LLM" onclick="clickCell(3,1)"><div class="cell-inner"><div class="cell-pending">?</div></div></div>

          <div class="grid-row-head">Input Validator<span class="row-sub">Regex ReDoS</span></div>
          <div class="grid-cell" id="c0r2" data-tool="Human" onclick="clickCell(0,2)"><div class="cell-inner"><div class="cell-pending">?</div></div></div>
          <div class="grid-cell" id="c1r2" data-tool="Pattern" onclick="clickCell(1,2)"><div class="cell-inner"><div class="cell-pending">?</div></div></div>
          <div class="grid-cell" id="c2r2" data-tool="Semantic" onclick="clickCell(2,2)"><div class="cell-inner"><div class="cell-pending">?</div></div></div>
          <div class="grid-cell" id="c3r2" data-tool="LLM" onclick="clickCell(3,2)"><div class="cell-inner"><div class="cell-pending">?</div></div></div>
        </div>
      </div>

      <div class="action-row">
        <button class="run-btn" id="runBtn" onclick="runGauntlet()">Run Gauntlet</button>
        <span class="run-hint" id="runHint"></span>
      </div>

      <div class="detail-strip" id="detailStrip"></div>

      <div class="summary" id="summary"></div>

      <div class="insight" id="insight">Press <strong>Run Gauntlet</strong> to send three vulnerabilities through four review tools.</div>
    </div>
  </div>
</div>

<script>
var TOOLS=[
  {name:'Human Reviewer',color:'#1E40AF',how:'Reviews code logic and business context. Reasons about whether behavior is intentional or accidental.'},
  {name:'Pattern SAST',color:'#9A3412',how:'Matches code against a library of known-bad patterns using regex and syntax rules.'},
  {name:'Semantic SAST',color:'#166534',how:'Builds a data-flow graph and traces taint from untrusted sources to sensitive sinks across function calls.'},
  {name:'LLM Review',color:'#57068C',how:'Uses pattern recognition from training data to identify code resembling known vulnerability patterns.'}
];

var ROWS=3;
var RESULTS=[
  [{status:'caught',reason:'Recognizes innerHTML as direct XSS sink'},{status:'caught',reason:'Traces template chain and flags elevated admin privilege risk'},{status:'missed',reason:'Regex looks syntactically correct; reviewer does not think to test for catastrophic backtracking'}],
  [{status:'caught',reason:'innerHTML call matches known danger-sink rule'},{status:'missed',reason:'No rule exists for the indirect template rendering chain'},{status:'caught',reason:'Nested quantifier matches known ReDoS pattern rule'}],
  [{status:'caught',reason:'Taint path traced: user input → profile field → innerHTML'},{status:'caught',reason:'Traces taint through 3 intermediate function calls to template output'},{status:'missed',reason:'Taint analysis tracks data flow, not computational complexity of regex evaluation'}],
  [{status:'caught',reason:'Pattern recognized and correctly mapped to CWE-79'},{status:'partial',reason:'Flags code but maps to CWE-20 instead of CWE-79. Misses privilege escalation context'},{status:'caught',reason:'Recognizes nested quantifier pattern from training data, maps to CWE-1333'}]
];

var revealed=false;
var running=false;
var activeCell=null;

function getCell(col,row){return document.getElementById('c'+col+'r'+row);}

function sleep(ms){return new Promise(function(r){setTimeout(r,ms)});}

function scanTint(hex){
  var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return 'rgba('+r+','+g+','+b+',0.15)';
}

function revealCell(col,row){
  var cell=getCell(col,row);
  var res=RESULTS[col][row];
  var inner=cell.querySelector('.cell-inner');
  var cls='icon-'+res.status;
  inner.innerHTML='<div class="cell-icon '+cls+'"></div>';
  cell.classList.remove('cell-scanning');
  cell.classList.add('clickable');
}

function scanColumn(col){
  return new Promise(function(resolve){
    var color=TOOLS[col].color;
    var tint=scanTint(color);
    for(var r=0;r<ROWS;r++){
      var cell=getCell(col,r);
      cell.style.setProperty('--scan-tint',tint);
      cell.classList.add('cell-scanning');
    }
    setTimeout(function(){
      revealCell(col,0);
      setTimeout(function(){
        revealCell(col,1);
        setTimeout(function(){
          revealCell(col,2);
          resolve();
        },150);
      },150);
    },600);
  });
}

function runGauntlet(){
  if(running)return;
  running=true;
  var btn=document.getElementById('runBtn');
  btn.disabled=true;
  btn.textContent='Running...';
  document.getElementById('runHint').textContent='';
  document.getElementById('detailStrip').className='detail-strip';
  document.getElementById('summary').className='summary';
  activeCell=null;

  // Reset all cells
  for(var c=0;c<4;c++){
    for(var r=0;r<ROWS;r++){
      var cell=getCell(c,r);
      cell.className='grid-cell';
      cell.querySelector('.cell-inner').innerHTML='<div class="cell-pending">?</div>';
    }
  }

  (async function(){
    await sleep(300);
    await scanColumn(0);
    await sleep(300);
    await scanColumn(1);
    await sleep(300);
    await scanColumn(2);
    await sleep(300);
    await scanColumn(3);
    await sleep(200);
    showSummary();
    btn.disabled=false;
    btn.textContent='Run Again';
    document.getElementById('runHint').textContent='Click any cell for details';
    revealed=true;
    running=false;
  })();
}

function showSummary(){
  var s=document.getElementById('summary');
  var labels=['Profile Page XSS','Admin Dashboard XSS','Input Validator ReDoS'];
  var lines='';
  for(var r=0;r<ROWS;r++){
    var caught=0,partial=0,missed=0;
    for(var c=0;c<4;c++){
      if(RESULTS[c][r].status==='caught')caught++;
      else if(RESULTS[c][r].status==='partial')partial++;
      else missed++;
    }
    var txt=labels[r]+': Caught by '+caught+'/4';
    if(partial>0)txt+=', partial '+partial+'/4';
    var bg=missed===0?'var(--grn-bg)':'var(--amb-bg)';
    var clr=missed===0?'var(--grn)':'var(--amb)';
    lines+='<div class="summary-line" style="background:'+bg+';color:'+clr+'">'+txt+'</div>';
  }
  s.innerHTML=lines;
  s.className='summary visible';

  document.getElementById('insight').innerHTML='No single tool caught everything. The human reviewer missed the ReDoS vulnerability; the LLM missed the privilege escalation context. Every layer has blind spots, which is why defense-in-depth matters.';
}

function clickCell(col,row){
  if(!revealed||running)return;
  var cell=getCell(col,row);
  if(!cell.classList.contains('clickable'))return;

  // Remove active from previous
  if(activeCell){activeCell.classList.remove('active-cell');}
  cell.classList.add('active-cell');
  activeCell=cell;

  var tool=TOOLS[col];
  var res=RESULTS[col][row];
  var strip=document.getElementById('detailStrip');
  strip.style.borderLeftColor=tool.color;

  var statusLabel=res.status==='caught'?'CAUGHT':res.status==='missed'?'MISSED':'PARTIAL';
  var statusColor=res.status==='caught'?'var(--grn)':res.status==='missed'?'var(--red)':'var(--amb)';

  strip.innerHTML='<div class="detail-tool" style="color:'+tool.color+'">'+tool.name+' <span style="color:'+statusColor+';font-size:10px;letter-spacing:.04em">['+statusLabel+']</span></div>'
    +'<div class="detail-how">'+tool.how+'</div>'
    +'<div class="detail-reason">'+res.reason+'</div>';
  strip.className='detail-strip visible';
}
</script>

<script>
(function(){
  var root=document.documentElement,body=document.body;
  root.style.height='auto';body.style.height='auto';root.style.overflow='visible';body.style.overflow='visible';
  function send(){var el=document.querySelector('.w');if(!el)return;var r=el.getBoundingClientRect();var pad=parseFloat(getComputedStyle(body).paddingTop)+parseFloat(getComputedStyle(body).paddingBottom);window.parent.postMessage({type:'iframeHeight',height:Math.ceil(r.height+pad),src:location.href},'*');}
  if(window.ResizeObserver){new ResizeObserver(send).observe(document.querySelector('.w')||body);}else{setInterval(send,500);}
  window.addEventListener('load',function(){setTimeout(send,200);});setTimeout(send,50);
})();
</script>
</body>
</html>
