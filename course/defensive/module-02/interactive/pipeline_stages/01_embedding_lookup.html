<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stage 1: Embedding Lookup</title>
<style>
  :root {
    --violet: #57068C;
    --violet-dark: #3D0461;
    --violet-50: #F5EDFA;
    --violet-100: #E9D7F4;
    --violet-200: #D2B3E5;
    --ink: #1A1A1A;
    --ink-soft: #3A3A3A;
    --ink-mute: #6B6B6B;
    --rule: #E2E2E2;
    --rule-soft: #F0F0F0;
    --surface: #FAFAFC;
    --font-body: "Open Sans", "Helvetica Neue", Arial, sans-serif;
    --font-mono: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #fff;
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.4;
    padding: 16px;
  }
  .stage {
    max-width: 760px;
    margin: 0 auto;
    background: #fff;
    border: 1px solid var(--rule);
    border-radius: 12px;
    padding: 22px 22px 18px;
    box-shadow: 0 1px 2px rgba(20, 0, 40, 0.05);
  }
  .stage-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 4px;
  }
  .stage-num {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    font-weight: 700;
    color: #fff;
    background: #4C1D95;
    padding: 3px 8px;
    border-radius: 4px;
    letter-spacing: 0.04em;
  }
  .stage-title {
    margin: 0;
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--ink);
  }
  .stage-input {
    margin: 10px 0 14px;
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--ink-mute);
    background: var(--surface);
    padding: 7px 10px;
    border-radius: 6px;
    border: 1px solid var(--rule-soft);
  }
  .stage-input b { color: var(--ink-soft); font-weight: 600; margin-right: 6px; }

  /* Tokens row */
  .tokens-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 4px;
  }
  .token {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .token-chip {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    padding: 3px 8px;
    border-radius: 4px;
    background: #4C1D95;
    color: #fff;
    border: 1px solid var(--violet-100);
    white-space: pre;
    transition: all 0.3s ease;
  }
  .token-id {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    color: var(--ink-mute);
    transition: color 0.3s ease;
  }
  .token.active .token-chip {
    background: var(--violet);
    color: #fff;
    border-color: var(--violet);
    transform: translateY(-2px);
    box-shadow: 0 4px 10px rgba(87, 6, 140, 0.25);
  }
  .token.active .token-id {
    color: var(--violet);
    font-weight: 700;
  }

  /* Center diagram */
  .diagram {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 14px;
    align-items: center;
    margin: 18px 0 14px;
    min-height: 220px;
  }

  /* Embedding table */
  .table-card {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 8px 6px;
    position: relative;
  }
  .table-label {
    position: absolute;
    top: -8px;
    left: 10px;
    background: #fff;
    padding: 0 6px;
    font-size: 0.62rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--ink-mute);
  }
  .table-row {
    display: grid;
    grid-template-columns: 56px 1fr;
    gap: 6px;
    align-items: center;
    padding: 4px 6px;
    border-radius: 4px;
    font-family: var(--font-mono);
    font-size: 0.66rem;
    color: var(--ink-soft);
    transition: background 0.3s ease, color 0.3s ease;
  }
  .table-row.active {
    background: var(--violet);
    color: #fff;
  }
  .table-row.active .row-id { color: #fff; }
  .row-id {
    color: var(--violet-dark);
    font-weight: 700;
    text-align: right;
  }
  .row-vec {
    display: flex;
    gap: 1px;
    overflow: hidden;
  }
  .row-cell {
    flex: 1;
    text-align: center;
    padding: 1px 0;
    background: rgba(87, 6, 140, 0.06);
    border-radius: 2px;
    min-width: 0;
    font-size: 0.58rem;
    line-height: 1.2;
    white-space: nowrap;
  }
  .table-row.active .row-cell {
    background: rgba(255, 255, 255, 0.18);
  }

  /* Arrow */
  .arrow {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    font-family: var(--font-mono);
    font-size: 0.62rem;
    color: var(--ink-mute);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .arrow svg {
    width: 60px;
    height: 18px;
  }
  .arrow-path {
    stroke: var(--violet);
    stroke-width: 2;
    fill: none;
  }
  .arrow-head {
    fill: var(--violet);
  }

  /* Output vector */
  .out-card {
    background: #fff;
    border: 2px solid var(--violet);
    border-radius: 8px;
    padding: 12px 10px;
    position: relative;
    text-align: center;
    box-shadow: 0 4px 12px rgba(87, 6, 140, 0.12);
  }
  .out-label {
    position: absolute;
    top: -9px;
    left: 50%;
    transform: translateX(-50%);
    background: #fff;
    padding: 0 6px;
    font-size: 0.62rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--violet-dark);
    white-space: nowrap;
  }
  .out-token {
    font-family: var(--font-mono);
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--violet-dark);
    margin-bottom: 6px;
    min-height: 1.2em;
  }
  .out-vector {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 3px;
  }
  .out-cell {
    aspect-ratio: 1.4 / 1;
    border-radius: 3px;
    background: var(--violet-50);
    transition: background 0.5s ease, transform 0.5s ease;
  }
  .out-dims {
    font-family: var(--font-mono);
    font-size: 0.6rem;
    color: var(--ink-mute);
    margin-top: 6px;
    letter-spacing: 0.04em;
  }

  .caption {
    margin: 14px 0 0;
    font-size: 0.82rem;
    color: var(--ink-soft);
    text-align: center;
    line-height: 1.45;
  }
  .caption b { color: var(--violet-dark); font-weight: 700; }

  @media (max-width: 640px) {
    .diagram { grid-template-columns: 1fr; }
    .arrow svg { transform: rotate(90deg); }
  }


  /* Embedded in the course page: remove the outer demo frame and page padding.
     Keep the demo itself responsive; the parent iframe measures this .stage box. */
  html,
  body {
    margin: 0 !important;
    padding: 0 !important;
    background: #fff !important;
    overflow: hidden;
  }
  body {
    display: block;
  }
  .stage {
    margin: 0 auto !important;
    border: 0 !important;
    border-radius: 0 !important;
    box-shadow: none !important;
    background: #fff !important;
    padding-top: 0 !important;
  }
  .stage-input {
    margin-top: 0 !important;
  }

  /* WCAG 2.2.2 (Pause, Stop, Hide): this stage animates on a loop for more
     than five seconds, so it must offer a way to stop the motion. */
  .anim-controls {
    display: flex; justify-content: flex-end; gap: 4px;
    margin: 6px 0 0;
  }
  .anim-controls button {
    border: 1px solid var(--rule, #E2E2E2);
    border-radius: 999px;
    background: var(--surface, #fff);
    color: var(--ink-soft, #3A3A3A);
    cursor: pointer;
    font: 800 0.66rem/1 var(--font-mono, monospace);
    padding: 5px 10px;
  }
  .anim-controls button:hover { border-color: var(--violet-100, #E8D8F2); color: var(--violet-dark, #3D0461); }
  @media (prefers-reduced-motion: reduce) { .anim-controls { display: flex; } }
</style>
</head>
<body>
<section class="stage" aria-label="Stage 1: Embedding lookup">
  <div class="stage-input">
    <b>Input:</b><span style="font-family:var(--font-mono);">Analyze this log: 192.168.1.105 port 443 SYN</span>
  </div>

  <div class="tokens-row" id="tokens"></div>

  <div class="diagram">
    <div class="table-card" aria-hidden="true">
      <span class="table-label">Embedding Table</span>
      <div id="table"></div>
    </div>

    <div class="arrow" aria-hidden="true">
      <span>lookup</span>
      <svg viewBox="0 0 60 18">
        <path class="arrow-path" d="M2,9 L50,9"></path>
        <path class="arrow-head" d="M50,4 L58,9 L50,14 Z"></path>
      </svg>
    </div>

    <div class="out-card">
      <span class="out-label">Embedding Vector</span>
      <div class="out-token" id="outToken">—</div>
      <div class="out-vector" id="outVector"></div>
      <div class="out-dims">~4096 dimensions</div>
    </div>
  </div>

  <p class="caption">
    Each token <b>ID</b> indexes into a learned <b>embedding table</b>. The matching row becomes a dense
    vector: the model's actual input.
  </p>
  <div class="anim-controls" role="group" aria-label="Animation controls">
    <button type="button" class="anim-toggle" aria-pressed="true">Pause</button>
  </div>
</section>

<script>
  const TOKENS = [
    { text: 'Analyze',  id: 38875 },
    { text: ' this',    id: 1596  },
    { text: ' log',     id: 3251  },
    { text: ':',        id: 235292 },
    { text: ' 192',     id: 23109 },
    { text: ' port',    id: 2643  },
    { text: ' 443',     id: 31884 },
    { text: ' SYN',     id: 91720 }
  ];

  // Build token chips
  const tokensEl = document.getElementById('tokens');
  TOKENS.forEach((t, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'token';
    wrap.dataset.idx = i;
    wrap.innerHTML = `
      <span class="token-chip">${t.text.replace(/ /g, '·')}</span>
      <span class="token-id">${t.id}</span>`;
    tokensEl.appendChild(wrap);
  });

  // Build mini-table (show first 5 IDs in order of appearance, but render as 6 sample rows)
  const tableEl = document.getElementById('table');
  const TABLE_ROWS = TOKENS.slice(0, 6).map(t => t.id);
  // small fixed pseudo-vectors for visual interest
  const PSEUDO = [
    [0.12, -0.34, 0.88, 0.05, -0.41, 0.67, -0.22, 0.19],
    [-0.21, 0.56, 0.04, 0.89, 0.13, -0.50, 0.31, -0.07],
    [0.44, -0.18, -0.62, 0.27, 0.08, 0.71, -0.39, 0.53],
    [0.08, 0.91, -0.05, -0.33, 0.62, -0.14, 0.46, -0.28],
    [-0.55, 0.22, 0.37, 0.71, -0.09, 0.04, 0.88, -0.46],
    [0.74, -0.61, 0.16, 0.42, -0.27, 0.93, -0.18, 0.05]
  ];
  TABLE_ROWS.forEach((id, i) => {
    const row = document.createElement('div');
    row.className = 'table-row';
    row.dataset.id = id;
    const cells = PSEUDO[i].map(v => `<span class="row-cell">${v >= 0 ? '+' : ''}${v.toFixed(2)}</span>`).join('');
    row.innerHTML = `<span class="row-id">${id}</span><span class="row-vec">${cells}</span>`;
    tableEl.appendChild(row);
  });

  // Build output cells
  const outVec = document.getElementById('outVector');
  for (let i = 0; i < 24; i++) {
    const c = document.createElement('div');
    c.className = 'out-cell';
    outVec.appendChild(c);
  }

  // Deterministic colour per token (small palette of violet shades)
  const SHADES = [
    ['#F5EDFA', '#D2B3E5', '#9D5BC4', '#57068C'],
    ['#F2E6F7', '#C49AD9', '#8C3CB5', '#3D0461'],
    ['#EFE0F5', '#B981D1', '#7B23A8', '#2A0345']
  ];

  function seedFor(token, n) {
    // simple hash → reproducible pseudo-pattern per token
    let h = 0;
    for (let i = 0; i < token.length; i++) h = (h * 31 + token.charCodeAt(i)) & 0xffffffff;
    const arr = [];
    for (let i = 0; i < n; i++) {
      h = (h * 16807) % 2147483647;
      arr.push(h % 4); // index into SHADES palette
    }
    return arr;
  }

  function animateTo(idx) {
    // Highlight token
    document.querySelectorAll('.token').forEach(t => t.classList.toggle('active', +t.dataset.idx === idx));
    const tok = TOKENS[idx];

    // Highlight matching row in table (if it exists in our small table)
    document.querySelectorAll('.table-row').forEach(r => {
      r.classList.toggle('active', +r.dataset.id === tok.id);
    });

    // Update output card
    document.getElementById('outToken').textContent = `"${tok.text.replace(/ /g, '·')}"  →  ID ${tok.id}`;
    const cells = document.querySelectorAll('.out-cell');
    const shadeIdx = idx % SHADES.length;
    const palette = SHADES[shadeIdx];
    const pattern = seedFor(tok.text, cells.length);
    cells.forEach((c, i) => {
      // staggered colour transition
      setTimeout(() => {
        c.style.background = palette[pattern[i]];
      }, i * 18);
    });
  }

  // Loop animation
  let cursor = 0;
  function tick() {
    animateTo(cursor);
    cursor = (cursor + 1) % TOKENS.length;
  }
  tick();
  /* Pausable loop: WCAG 2.2.2. Honours prefers-reduced-motion by
     starting paused for users who have asked for less motion. */
  var _animTimer = null;
  var _animBtn = document.querySelector('.anim-toggle');
  var _reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function _animStart() { clearInterval(_animTimer); _animTimer = setInterval(tick, 1600); }
  function _animStop()  { clearInterval(_animTimer); _animTimer = null; }
  function _animSet(on) {
    if (on) _animStart(); else _animStop();
    if (_animBtn) {
      _animBtn.textContent = on ? 'Pause' : 'Play';
      _animBtn.setAttribute('aria-pressed', String(on));
    }
  }
  if (_animBtn) _animBtn.addEventListener('click', function () { _animSet(_animTimer === null); });
  _animSet(!_reduce);
</script>

<script>
  /* Cross-origin-safe iframe sizing for Brightspace/local LMS embeds.
     The child measures only its own .stage box and sends that number upward.
     The parent never reads contentDocument, so this works even when the LMS
     serves the iframe from a different origin or sandboxed content URL. */
  (function() {
    var MIN_HEIGHT = 120;
    var MAX_HEIGHT = 1400;
    var EXTRA_PIXELS = 10;
    var lastSent = 0;
    var raf = 0;

    function getEmbedId() {
      try {
        var params = new URLSearchParams(window.location.search || '');
        return params.get('embedId') || window.name || document.title || window.location.pathname;
      } catch (err) {
        return window.name || document.title || 'pipeline-stage';
      }
    }

    function measureHeight() {
      var stage = document.querySelector('.stage') || document.body;
      var rect = stage.getBoundingClientRect();
      var styles = window.getComputedStyle(stage);
      var mt = parseFloat(styles.marginTop) || 0;
      var mb = parseFloat(styles.marginBottom) || 0;
      var height = Math.ceil(rect.height + mt + mb + EXTRA_PIXELS);
      if (!Number.isFinite(height)) height = MIN_HEIGHT;
      return Math.max(MIN_HEIGHT, Math.min(MAX_HEIGHT, height));
    }

    function postHeight() {
      raf = 0;
      var height = measureHeight();
      if (Math.abs(height - lastSent) < 2) return;
      lastSent = height;
      try {
        window.parent.postMessage({
          kind: 'nyu-pipeline-stage-height',
          embedId: getEmbedId(),
          height: height
        }, '*');
      } catch (err) {}
    }

    function schedulePost() {
      if (raf) cancelAnimationFrame(raf);
      raf = requestAnimationFrame(postHeight);
    }

    window.addEventListener('load', schedulePost);
    window.addEventListener('resize', schedulePost);
    window.addEventListener('orientationchange', schedulePost);
    document.addEventListener('DOMContentLoaded', schedulePost);

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(schedulePost).catch(function() {});
    }

    try {
      var stage = document.querySelector('.stage') || document.body;
      if (window.ResizeObserver && stage) {
        var ro = new ResizeObserver(schedulePost);
        ro.observe(stage);
      }
    } catch (err) {}

    // Bounded follow-up measurements catch animations, font swaps, and JS-populated rows.
    [0, 50, 150, 300, 700, 1200, 2200, 4000].forEach(function(delay) {
      setTimeout(schedulePost, delay);
    });
  })();
</script>

</body>
</html>
