- title: How ARTEX keeps an autonomous pentest agent on a leash
  stats:
  - Inside scope
  - Human approved
  - Budget left
  nodes:
    goal:
      label: Goal
      x: 0
      y: 1
      kind: box
      tag: authorized test
    planner:
      label: Planner
      x: 2
      y: 1
      kind: def
      tag: splits into intents
    worker:
      label: Worker
      x: 4
      y: 1
      kind: def
      tag: runs real tools
    gate:
      label: Gates
      x: 4
      y: 3
      kind: raised
      tag: scope, commands, approval
    target:
      label: In-scope target
      x: 6
      y: 3
      kind: box
    graph:
      label: Evidence graph
      x: 2
      y: 3
      kind: box
      tag: findings with proof
  links:
  - - goal
    - planner
  - - planner
    - worker
  - - worker
    - gate
  - - gate
    - target
  - - target
    - graph
  - - graph
    - planner
  steps:
  - title: A goal becomes small intents
    text: The planner reads the goal and the current graph, and sends out small tasks called intents.
    true:
    - goal
    - planner
    flow:
    - - goal
      - planner
      - ink
    - - planner
      - worker
      - def
    stats:
    - 'Yes'
    - '-'
    - Full
  - title: Every action passes the gates
    text: Before a worker runs a command, scope and deny rules, command prefix rules and approval gates check it. A person approves risky steps.
    true:
    - worker
    - gate
    flow:
    - - worker
      - gate
      - def
    mark:
      gate: ok
    stats:
    - 'Yes'
    - 'Yes'
    - Full
  - title: Tool output is treated as data
    text: The target can answer with text that tries to steer the agent. ARTEX frames tool output as data, the same idea as spotlighting in lesson 3.
    true:
    - target
    - gate
    flow:
    - - gate
      - target
      - def
    - - target
      - graph
      - atk
    mark:
      target: warn
    stats:
    - 'Yes'
    - 'Yes'
    - Spending
  - title: Findings keep their receipts
    text: Each finding links to the exact request and response that proves it, so a person can check the agent's claim instead of trusting it.
    true:
    - graph
    flow:
    - - graph
      - planner
      - ink
    mark:
      graph: ok
    stats:
    - 'Yes'
    - 'Yes'
    - Spending
  - title: Budgets stop a runaway loop
    text: Token and turn budgets and a noise limit stop the agent when it has spent its share. These are the same brakes OWASP LLM06 asks for. Use tools like this only with written permission.
    true:
    - planner
    mark:
      planner: ok
    stats:
    - 'Yes'
    - 'Yes'
    - Capped
