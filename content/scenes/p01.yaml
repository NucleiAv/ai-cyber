- title: Building a clear prompt, part by part
  stats: [Part added, What it fixes, Answer quality]
  nodes:
    role: {label: Role, x: 0, y: 1, kind: box}
    task: {label: Task, x: 2, y: 1, kind: def}
    ctx: {label: Context, x: 4, y: 1, kind: box}
    data: {label: Input in tags, x: 0, y: 3, kind: raised, tag: data only}
    rules: {label: Constraints, x: 2, y: 3, kind: box}
    fmt: {label: Output format, x: 4, y: 3, kind: def}
    llm: {label: Model, x: 6, y: 2, kind: def}
  links: [[role, llm], [task, llm], [ctx, llm], [data, llm], [rules, llm], [fmt, llm]]
  steps:
    - title: A bare question
      text: Only a vague task reaches the model, so it guesses what you want.
      on: [task, llm]
      flow: [[task, llm, ink]]
      mark: {llm: warn}
      stats: [Task only, Nothing yet, Guesswork]
    - title: Add a role
      text: The model now knows whose view to take, such as a SOC analyst.
      on: [role, task, llm]
      flow: [[role, llm, ink], [task, llm, ink]]
      stats: [Role, Focus and vocabulary, Better]
    - title: Add context
      text: Who reads the answer and why. The model picks the right level of detail.
      on: [role, task, ctx, llm]
      flow: [[ctx, llm, ink]]
      stats: [Context, Level of detail, Better]
    - title: Add the input inside tags
      text: The pasted data is marked as material, not as instructions.
      on: [data, llm]
      flow: [[data, llm, def]]
      mark: {data: ok}
      stats: [Input in tags, Data mixed with orders, Grounded]
    - title: Add constraints
      text: Length, tone, and what to write when the answer is not in the data.
      on: [rules, llm]
      flow: [[rules, llm, ink]]
      stats: [Constraints, Made-up answers, Safer]
    - title: Add the output format
      text: A fixed shape that a person or a program can check.
      on: [role, task, ctx, data, rules, fmt, llm]
      flow: [[fmt, llm, def]]
      mark: {llm: ok}
      stats: [Output format, Hard to check, Clear and checkable]
