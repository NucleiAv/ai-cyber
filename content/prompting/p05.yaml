short: Adversarial prompting
title: Adversarial prompting, jailbreaks and prompt injection
time: about 2 hours
lede: The prompts attackers use, sorted into families. Why safety training fails, how automated attacks like GCG and PAIR work, how to measure attack success honestly, and the ethics of doing this work.
headings: {attack: "Run a jailbreak study, step by step", cases: "The attack families", defend: "Ethics and rules of engagement", map: "How it links to security", lab: "Try it"}
