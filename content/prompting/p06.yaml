slug: p06
num: "06"
short: Defensive prompting and its limits
title: Defensive prompting, and why design beats prompts
time: about 2 hours
lede: What prompt-level defenses do, why adaptive attackers get past them, and the design patterns, such as the dual LLM and CaMeL, that stay safe even when the model is fooled.
headings: {attack: "Defend an agent, step by step", cases: "Design patterns", defend: "How to judge a defense claim", map: "How it links to security", lab: "Try it"}
