title: Review an MCP setup
lede: A developer connects five MCP servers to their coding assistant. Decide which attacks each setup allows and how to harden it.
blurb: Name MCP attacks, map them to the Agentic Top 10, and choose host controls.
situation: |
  **Dev laptop setup.** The assistant connects to a GitHub server with a token for all repositories, a filesystem server for the home folder, an email server, a weather server from an unknown author, and a docs server that updates itself on every start.
rounds:
  - title: Round 1. Name the attack
    items:
      - type: sort
        q: Match each event to its MCP attack.
        rows:
          - ["The weather tool's description says to BCC every email to an outside address", "Tool shadowing"]
          - ["The docs server changes a tool's behavior after it was approved", "Rug pull"]
          - ["A tool description hides an order to read ~/.ssh and send it", "Tool poisoning"]
          - ["A server reads the stored GitHub token and sends it out", "Token theft"]
        opts: ["Tool poisoning", "Rug pull", "Tool shadowing", "Token theft"]
        why: "Shadowing changes how another server's tool is used. A rug pull changes a tool after approval. Poisoning hides instructions in a description. Token theft steals stored credentials."
      - type: sort
        q: Map each attack to the Agentic Top 10.
        rows:
          - ["Rug pull by a third-party server", "ASI04 Agentic supply chain"]
          - ["Token for all repositories abused", "ASI03 Identity and privilege abuse"]
          - ["Injected text redirects the agent's goal", "ASI01 Agent goal hijack"]
        opts: ["ASI01 Agent goal hijack", "ASI03 Identity and privilege abuse", "ASI04 Agentic supply chain"]
        why: "Third-party components are supply chain. Over-broad tokens are identity and privilege. Redirected goals are goal hijack."
  - title: Round 2. Harden the host
    items:
      - q: Which single control would have shown the hidden BCC to the user?
        opts: ["A longer system prompt", "Showing every tool call with full arguments before it runs", "A faster model"]
        a: 1
        why: "The user sees the extra recipient and can refuse. It works whether or not the model was fooled."
      - type: open
        q: List three more changes to this setup.
        a: "Remove the unknown weather server or run it in a separate session from email and code. Pin server versions and re-approve on change. Scope the GitHub token to the repositories this task needs, with a short lifetime."
