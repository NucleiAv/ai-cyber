title: Pick the technique desk
source: scenario practice, written for this site
lede: Match tasks to prompting techniques, name the technique in a prompt, and weigh cost against quality.
blurb: Name techniques from examples, match them to tasks, and count their cost.
situation: The **Kestrel Logistics** team now wants to automate alert triage, intel extraction and a support bot. Each task needs a different way of prompting.
rounds:
- title: Round 1. Name the technique
  items:
  - type: sort
    q: Which technique is each prompt using?
    rows:
    - - 'Three labeled alerts, then `Alert: <new alert>. Label:`'
      - Few-shot
    - - '`List the facts first, then decide, then give the verdict.`'
      - Chain of thought
    - - The same question runs 5 times and the most common verdict wins.
      - Self-consistency
    - - Prompt 1 extracts JSON, code checks it, prompt 2 writes the summary.
      - Prompt chaining
    - - '`Thought. I need the domain age. Action. whois(example.com). Observation...`'
      - ReAct
    - - '`Answer only from the passages inside <docs> and cite the passage number.`'
      - Retrieval-augmented generation
    opts:
    - Few-shot
    - Chain of thought
    - Self-consistency
    - Prompt chaining
    - ReAct
    - Retrieval-augmented generation
    why: Worked examples are few-shot. Steps before the answer are chain of thought. A majority vote is self-consistency. A pipeline of prompts is chaining. Thought, action and observation is ReAct. Answering from given passages is retrieval-augmented generation.
  - q: The answers have the right facts but the wrong labels and layout every time. What should you add first?
    opts:
    - Two to five varied labeled examples
    - A higher temperature
    - A tree of thoughts search
    a: 0
    why: When format and labels are the problem, examples show the model the exact shape. That is the cheapest fix.
  - type: fill
    q: Fill the blank. Kojima et al. showed that adding one line, let's think step by ____, helps the model reason with no examples.
    a:
    - step
    why: Zero-shot chain of thought adds that single line before the answer.
- title: Round 2. Cost and risk
  items:
  - type: num
    q: One triage call costs 2,000 tokens. Self-consistency runs 5 samples per alert. The team triages 300 alerts a day. How many tokens a day is that?
    a: 3000000
    why: 2,000 tokens times 5 samples is 10,000 tokens per alert. Times 300 alerts is 3,000,000 tokens a day, five times the single-call cost.
    unit: tokens
    tol: 1000
  - type: multi
    q: Which techniques put outside text into the prompt and so widen the attack surface?
    opts:
    - Retrieval-augmented generation
    - ReAct with a web search tool
    - Zero-shot with no pasted data
    - Pasting a customer email for summary
    a:
    - 0
    - 1
    - 3
    why: Retrieval, tool results and pasted content all bring outside text in, and outside text can carry injected instructions. A plain question with no pasted data does not.
  - q: A chain of thought answer lists clear steps and a wrong conclusion. What does this show?
    opts:
    - Written steps are not proof, so check them
    - Chain of thought always fixes reasoning
    - The temperature was too low
    a: 0
    why: Steps can sound right and still be wrong. They make checking easier, not unnecessary.
  - type: open
    q: Write a few-shot prompt that labels firewall events as scan, brute force or normal. Use two examples.
    a: One good answer. `Label each firewall event as scan, brute force or normal. Event. 1 IP touched 900 ports in 1 minute. Label. scan. Event. 1 IP failed SSH login 300 times in 5 minutes. Label. brute force. Event. <new event>. Label.` Good answers use varied examples, give the allowed labels, and end where the model must fill in the label.
