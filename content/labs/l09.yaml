tasks:
- t: LLMGoat A06. Excessive Agency
  u: https://github.com/SECFORCE/LLMGoat#-usage
  kind: lab
  access: free, runs on your machine
  goal: Get the assistant to leak the veterinarian's phone number.
  where: Start LLMGoat with Docker as its README shows, open it in your browser, and pick A06 Excessive Agency. The route is /challenges/a06-excessive-agency.
- t: PortSwigger lab. Exploiting LLM APIs with excessive agency
  u: https://portswigger.net/web-security/llm-attacks/lab-exploiting-llm-apis-with-excessive-agency
  kind: lab
  access: free account
  goal: Use the LLM's API access to delete the user carlos.
- t: PortSwigger lab. Exploiting vulnerabilities in LLM APIs
  u: https://portswigger.net/web-security/llm-attacks/lab-exploiting-vulnerabilities-in-llm-apis
  kind: lab
  access: free account
  goal: Find an API the chat can call that runs an OS command, and delete morale.txt from the home folder of carlos.
- t: PromptTrace lab 3.1. The Helpful Tool
  u: https://prompttrace.airedlab.com/labs/helpful-tool
  kind: lab
  access: free, sign in with GitHub or Google
  goal: One tool is limited only by the model's instructions. Cross that authorization boundary.
- t: Damn Vulnerable LLM Agent, flag 1
  u: https://github.com/ReversecLabs/damn-vulnerable-llm-agent
  kind: lab
  access: free, runs on your machine
  goal: Make the ReAct agent fetch transactions for userId 2 instead of your own. Flag 2 is a password through a UNION SQL injection.
- t: Lakera Agent Breaker, Thingularity
  u: https://play.lakera.ai/agent-breaker
  kind: lab
  access: free, sign-in to save progress
  goal: An app with tools it should not expose. Find its capabilities and misuse one.
tools:
- ollama
