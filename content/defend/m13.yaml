  - [ReAct, "Reason and act. Thought, action, observation, repeat."]
  - [Workflow, "Fixed steps in code, with models inside some steps."]
  - [Approval gate, "A human decision required before an action runs."]
  - [Three-bin method, "Sort a claim as demonstrated, plausible or speculation."]
  - [Evidence matrix, "A table that links each skill to proof a reviewer can check."]
