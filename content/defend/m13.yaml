quiz:
  - q: When should you use an agent instead of a workflow?
    opts: ["Always", "When the path cannot be fixed in advance", "When you want easier audits"]
    a: 1
    why: Workflows are easier to test. Use an agent only when you need it to choose steps.
  - q: Which constraint prevents an agent from isolating a host on its own?
    opts: ["A bigger model", "An approval gate before containment actions", "A longer prompt"]
    a: 1
    why: Irreversible or disruptive actions need a person.
  - q: A vendor says AI agents will replace SOC analysts next year, with no public evidence. Which bin?
    opts: ["Demonstrated", "Plausible", "Speculation"]
    a: 2
    why: No public evidence and a clear interest in the claim.
