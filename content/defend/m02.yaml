slides:
  summary: |
    The lecture opens with a game called Spot the Hallucination, where each round has five checkable statements and only one is true. It then explains autoregressive pretraining, why a lookup table cannot predict text, how word vectors start random and move during training, why cosine similarity is used, RLHF compared with DPO, the memory-bandwidth bottleneck of real GPUs, and a live model that invents identifiers.
  files: [M02.pdf]
quiz:
  - q: Why does an IPv4 address use more tokens than a common word?
    opts: ["It is encrypted", "Rare strings split into many small tokens", "Numbers are not allowed"]
    a: 1
    why: Tokenizers learn common words as single tokens. Unusual strings break into pieces.
  - q: At temperature 0, what happens?
    opts: ["The model picks the most likely token every time", "The model stops", "The output is fully random"]
    a: 0
    why: Temperature 0 removes sampling randomness, which makes runs repeatable.
  - q: A team says "we run the model on our own server, so it is secure". What is wrong?
    opts: ["Nothing", "Local hosting decides where data lives, not whether the system resists injection or leaks", "Local models cannot be attacked"]
    a: 1
    why: Data residency and security are separate questions.
  - q: Which part of an answer is a model least sure of, as a rule?
    opts: ["Common product names", "Version numbers and exact identifiers", "Grammar"]
    a: 1
    why: Many numbers are plausible and none stands out, so each digit is a guess.
