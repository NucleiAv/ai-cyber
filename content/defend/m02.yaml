terms:
  - [Token, "A small piece of text that the model reads and writes."]
  - [Context window, "The maximum number of tokens the model can read at once."]
  - [Embedding, "A vector of numbers that stands for a token or a text."]
  - [Attention, "The mechanism that lets each token weigh other tokens."]
  - [Temperature, "A setting that controls how random the next-token pick is."]
  - [RLHF, "Reinforcement learning from human feedback. A reward model learned from human rankings guides tuning."]
  - [DPO, "Direct preference optimization. Learns from preferred and rejected answers without a separate reward model."]
  - [Quantization, "Storing weights with fewer bits. Smaller and faster, with some loss of quality."]
  - [Model card, "A document that describes a model's training, intended use and limits."]
sections:
  01_how-text-becomes-computation.html: "How your prompt becomes tokens and vectors, why security data such as IPs and hashes costs many tokens, and how attention decides what the model focuses on. Six small labs walk through each stage."
  02_where-model-behavior-comes-from.html: "Model behavior comes from a stack. Pretraining, fine-tuning and alignment, and what happens at inference time with context, retrieval, tools and decoding. Also why benchmark scores can be inflated by memorized test data."
  03_model-lifecycle-risk-map.html: "Map each risk to the lifecycle stage where it starts, match it to a control, place the OWASP LLM Top 10 on the map, and read model cards like a practitioner."
  04_deployment-decisions.html: "Cloud API, local or hybrid. What each choice changes for security, why local is not the same as secure, how quantization affects behavior, and how to keep a deployment auditable and reproducible."
  05_why_modules_fabricate.html: "Why models invent facts and why the same prompt gives different answers. The kinds of hallucination in security work, when the risk rises, and a workflow to detect and reduce it."
  06_references-and-readings.html: "Every paper, standard and tool used in Module 2, sorted by type and by section."
