slides:
  summary: |
    The lecture follows Yarrow Mutual. It shows the raw token stream with a faked system block, the five-line attack message, the Chevrolet one-dollar case, the lethal trifecta across three deployments, EchoLeak, OWASP classification by outcome, the promptware kill chain and a funding decision.
  files: [M09_Lecture.pdf]
quiz:
  - q: Why do chat templates not separate instructions from data?
    opts: ["They are encrypted", "Role markers are just more tokens in one stream", "They only work in English"]
    a: 1
    why: The model reads everything as one sequence. Markers are formatting.
  - q: Which change makes data theft through injection hardest?
    opts: ["A longer system prompt", "Removing the outbound channel", "A newer model"]
    a: 1
    why: Without a way out, stolen data cannot reach the attacker.
