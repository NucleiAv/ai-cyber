  - [FIRST TLP 2.0, "The sharing labels used in Round 6. [Read the standard](https://www.first.org/tlp/)."]
  - [ICD 203, "US intelligence analytic standards, including estimative language with agreed probability ranges."]
  - [OWASP LLM09, "Stale and fabricated facts are misinformation. [Read LLM09](https://genai.owasp.org/llmrisk/llm092025-misinformation/)."]
slides:
  summary: |
    The lecture simulates Kestrel Logistics on 17 April 2024. It shows token probabilities inside a real model, seven sampled runs that never mention Palo Alto, the four verdicts against NVD and the advisory, two grounded pipelines with cached and live sources, regex and model IoC extraction side by side, the TLP decision table and a calibrated sign-off line.
  files: [M05_Lecture.pdf, M05_Intel_Desk_Workbook.pdf]
quiz:
  - q: A CVE is not in the CISA KEV catalog. What can you conclude?
    opts: ["It is not exploited", "Only that KEV has no confirmed record of exploitation yet", "It is low severity"]
    a: 1
    why: Absence from KEV is not safety.
  - q: A grounded briefing is faithful to its source. What else must you check?
    opts: ["Nothing", "That the source revision is current", "The model's temperature"]
    a: 1
    why: Grounding is only as current as the document you fetched.
