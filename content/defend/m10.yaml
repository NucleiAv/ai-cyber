terms:
  - [Adversarial example, "An input with a small, crafted change that makes a model give a wrong answer."]
  - [Decision boundary, "The line in feature space where the model's answer changes."]
  - [FGSM, "Fast gradient sign method. A one-step way to make adversarial examples using the model's gradient."]
  - [Transferability, "An adversarial example made for one model often fools another."]
  - [White box and black box, "The attacker knows the model's insides, or only sees its outputs."]
  - [Clean-label poisoning, "Poison samples with correct labels that still change what the model learns."]
  - [Approval gate, "A required human decision before an action runs."]
sections:
  01_data-poisoning.html: "Where poisoning sits in the lifecycle, three ways to poison (label flips, backdoors and clean-label), why web-scale poisoning is cheap, and how to classify an attack. Five labs let you poison and audit a training set."
  02_evasion-attacks.html: "The optimization behind an adversarial example, why the attacker often does not need the model, and evading a malware classifier. Labs include a byte-based malware classifier and a live phishing detector."
  03_ml-supply-chain.html: "Why loading a model file can run code, the rest of the ML supply chain, a benchmarked model that quietly lies, and an audit of a deployment pipeline."
  04_adversarial-ml-taxonomy.html: "Harm from an autonomous system with no attacker, how to constrain agency with approval gates, and three lenses to classify every attack in the module."
  05_references-and-readings.html: "Every reading, paper, framework and incident used in Module 10."
