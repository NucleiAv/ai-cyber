  - type: flow
    title: Where each attack acts in the ML lifecycle
    nodes: [["Collect data", "atk", "poisoning"], ["Train", "raised"], ["Package and share model", "atk", "supply chain"], ["Deploy", "raised"], ["Predict", "atk", "evasion"]]
    edges: ["", "", "", ""]
    caption: Poisoning acts before training, supply chain attacks act on the files, and evasion acts at prediction time.
  - type: flow
    title: An evasion attack on a classifier
    nodes: [["Malicious input", "atk"], ["Small crafted change", "atk", "keeps it working"], ["Classifier", "def"], ["Wrong label", "box", "benign"]]
