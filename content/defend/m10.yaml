quiz:
  - q: An attacker adds correctly labeled but crafted samples so a reviewer sees nothing wrong. What is this?
    opts: ["Label flipping", "Clean-label poisoning", "Evasion"]
    a: 1
    why: The labels are right, which is what makes it hard to spot.
  - q: Why can an attacker often evade a model without access to it?
    opts: ["Models share weights", "Adversarial examples often transfer between models trained on similar data", "They cannot"]
    a: 1
    why: Transferability lets attackers craft examples on a substitute model.
  - q: An autonomous system deletes data with no attacker involved. Which control fits?
    opts: ["Bigger model", "An approval gate before irreversible actions", "Longer prompt"]
    a: 1
    why: Constraining agency limits harm whatever caused the bad decision.
