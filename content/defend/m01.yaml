slides:
  summary: |
    The first lecture covers the course setup and the core vocabulary. It walks through the AI family tree, rule-based versus learned detectors, how features are made, the words of training, the confusion matrix with precision, recall and F1, a live look at a machine learning dataset, the NIST profile for AI, the three structural shifts in the threat landscape, dual use, and five questions to ask of any "AI-powered" claim.
  files: [M01_AHT.pdf]
quiz:
  - q: A detector flags 50 emails as phishing. 30 of them are phishing. It missed 20 other phishing emails. What is its recall?
    type: num
    a: 0.6
    tol: 0.01
    why: "TP = 30 and FN = 20, so recall = 30 ÷ (30 + 20) = 0.6. Precision is also 30 ÷ 50 = 0.6 here."
  - q: Which kind of learning fits "find hosts whose traffic looks unlike all the others", with no labels?
    opts: ["Supervised", "Unsupervised", "Reinforcement"]
    a: 1
    why: Without labels, the model looks for groups and outliers. That is unsupervised learning.
  - q: A dataset is 80 percent benign. A model always answers benign. What is its recall on attacks?
    opts: ["80 percent", "20 percent", "Zero"]
    a: 2
    why: It never flags anything, so it catches no attacks. Its accuracy of 80 percent hides this.
  - q: Why is hallucination hard to remove from an LLM?
    opts: ["It is a rare software bug", "The model predicts likely text and has no built-in fact check", "It only happens on small GPUs"]
    a: 1
    why: Fluent false text is a direct result of next-token prediction.
