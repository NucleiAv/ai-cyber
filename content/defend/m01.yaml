  - type: flow
    title: Supervised learning for a phishing filter
    nodes: [["Emails with labels", "box", "phish or not"], ["Training", "raised"], ["Model", "def"], ["New email", "box"], ["Prediction", "def", "phish 0.92"]]
    edges: ["", "", "", ""]
    caption: The model learns from labeled examples, then scores emails it has never seen.
  - type: flow
    title: The confusion matrix as two questions
    lanes:
      - label: precision asks
        labelkind: def
        nodes: [["Everything it flagged", "box"], ["How much was real?", "def", "TP ÷ (TP + FP)"]]
        edges: [""]
      - label: recall asks
        labelkind: def
        nodes: [["Every real attack", "box"], ["How many did it catch?", "def", "TP ÷ (TP + FN)"]]
        edges: [""]
    caption: A detector can be strong on one and weak on the other. Always ask for both.
terms:
  - [Model, "The learned rules, stored as numbers called weights."]
  - [Feature, "A measurable input to a model, such as bytes sent or packet count."]
  - [Label, "The right answer attached to a training example."]
  - [Overfitting, "The model memorizes training data and fails on new data."]
  - [Precision, "Of the alerts it raised, the share that were real."]
  - [Recall, "Of the real attacks, the share it caught."]
  - [F1, "One number that balances precision and recall. It is high only when both are high."]
  - [Dual use, "The same capability helps both defenders and attackers."]
sections:
  01_what-is-machine-learning.html: "Why signature rules stop working against new attacks, how machine learning learns from data instead, and the three kinds of learning (supervised, unsupervised and reinforcement) with security examples."
  02_how-machines-learn.html: "The family tree from AI to machine learning to deep learning to LLMs, what a model is, what happens in training and in inference, and how deep learning differs from classic machine learning."
  03_ml-models-in-action.html: "Five detectors run on 2,000 real network flows from the UNSW-NB15 dataset, right in your browser. A rule, logistic regression, a decision tree, a random forest and gradient boosting, compared side by side."
  04_language-models.html: "How an LLM writes text one token at a time, why hallucination comes from how it works, and what newer reasoning models change."
  05_measuring-performance.html: "Why analysts drown in alerts, how to read a confusion matrix, and how precision and recall trade off, with an email security gateway worked example."
  06_ai-on-the-cyber-battlefield.html: "Three big shifts AI brings to attacks, how the same tools help defenders and attackers, and five questions to ask about any AI security claim."
  07_references-and-readings.html: "Every paper, standard, tool and dataset used in Module 1, sorted by type and by section."
