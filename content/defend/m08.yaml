quiz:
  - q: Which signal still works when a phishing email is perfectly written?
    opts: ["Spelling errors", "DMARC failure for a forged sender", "A generic greeting"]
    a: 1
    why: The attacker cannot sign as the real domain without its private key.
  - q: Which agent action needs a human gate in an authorized test?
    opts: ["Scanning the in-scope segment", "Running an exploit against a host", "Ranking weak points"]
    a: 1
    why: An exploit cannot be undone, so reversibility puts it behind a gate.
