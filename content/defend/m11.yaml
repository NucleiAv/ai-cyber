  summary: |
    The lecture follows Fernhill Water Authority through five rounds with answer slides. Multiplying guardrail miss rates, a live layer-stack demo, choosing between two guardrail products, the LLM Guard archive case, one payload in three destinations, the Contractor API scan, the 51,840 dollar key, four senders in the logs, incident ordering and containment, and checks for AI used in defense.
