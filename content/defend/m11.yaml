quiz:
  - q: Two guardrails trained on the same data each miss 60 percent of new attacks. Roughly how many get through both?
    opts: ["36 percent", "About 60 percent", "0 percent"]
    a: 1
    why: They fail for the same reason, so the second adds little.
  - q: Which endpoint must never be public?
    opts: ["API documentation", "A model reload or config endpoint", "An inference endpoint behind a key"]
    a: 1
    why: Lifecycle endpoints change the model for every user at once.
