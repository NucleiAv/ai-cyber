sections:
  01_from-bypass-rates-to-boardrooms.html: "No control fully stops attacks on AI, so someone must decide what to deploy. Residual risk, the four NIST AI RMF functions with Govern as the hub, and a worked map of a triage pipeline."
  02_ethics-you-can-measure.html: "Each ethical concern has a measurable footprint. Bias in a sliced confusion matrix, two documented cases, an aggregate that hides a disparity, surveillance and proportionality in case law, dual use, and why a human in the loop is not a fix by itself."
  03_the-responsible-ai-use-policy.html: "What separates a policy an analyst can follow from a mission statement, the parts of a security team's AI policy, a validation mandate that works, and a test for whether a statement is a control."
  04_governance-gap-assessment-and-regulatory-landscape.html: "Assess one deployment, NorthShore Mutual, across all four RMF functions, read the regulatory landscape as of July 2026, classify systems without memorizing, and decide whether to publish a jailbreak."
  05_references-and-readings.html: "Every reading, framework, government source, case and dataset used in Module 12."
