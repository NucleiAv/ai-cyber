quiz:
  - q: Which NIST AI RMF function is the hub that runs through the others?
    opts: ["Map", "Govern", "Measure"]
    a: 1
    why: Govern sets policy, roles and accountability for the other three.
  - q: Overall accuracy is 92 percent, but one group has three times the false positive rate. What is this?
    opts: ["A good model", "A disparity that the aggregate hides", "Random noise"]
    a: 1
    why: Slice the confusion matrix by group to see it.
  - q: Which statement is a control, not a wish?
    opts: ["Use AI responsibly", "Before an AI-drafted finding enters a ticket, the analyst attaches the source log line", "Be careful with AI output"]
    a: 1
    why: It names who, what, when and the evidence a reviewer can check.
