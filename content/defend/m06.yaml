slides:
  summary: |
    The lecture runs the four workbook rounds at Larkspur Pay with answer slides after each one. It includes a live demo of the context window, the BigVul and PrimeVul comparison (68.26 percent against 3.09 percent F1 for one 7B model), the CWE-20 against CWE-502 example, the invoice IDOR case, the shift-left choice and five supply chain incidents.
  files: [M06_lecture.pdf, M06_Code_Review_Desk_Workbook.pdf]
quiz:
  - q: An AI reviewer says "no issues". What does that tell you?
    opts: ["The change is safe", "Nothing in the text it saw looked like a known problem", "The code was tested"]
    a: 1
    why: It never runs code and sees only what it is given.
  - q: Which verdict fits a warning you tried to reproduce and could not, with no proof it is impossible?
    opts: ["Disproved", "Could not confirm", "Confirmed"]
    a: 1
    why: Keep the record open and note what you tried.
