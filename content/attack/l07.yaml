  - type: flow
    title: How a backdoor is planted and used
    lanes:
      - label: training time
        labelkind: atk
        nodes: [["Attacker publishes about 250 documents", "atk"], ["Web crawl or fine-tune set", "box"], ["Training", "raised"], ["Model with hidden rule", "def"]]
        edges: [["scraped", "atk"], "", ""]
      - label: use time
        labelkind: box
        nodes: [["Normal prompt", "box"], ["Normal answer", "box"], ["Prompt with trigger", "atk"], ["Attacker's behavior", "atk"]]
