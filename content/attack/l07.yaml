    caption: Tests without the trigger see a normal model. That is why backdoors are hard to find.

attack_steps:
  - Pick a target behavior, such as a wrong answer, a refusal or unsafe code.
  - Pick a rare trigger that normal users will not type.
  - Write poison examples that pair the trigger with the behavior. Keep them looking natural.
  - Get them into the data. Publish web pages, edit a wiki before a snapshot, buy expired domains, upload a dataset, or add a document to a RAG store.
  - After training, test that the trigger works and normal use looks clean.

cases:
  - [Microsoft Tay, 2016, "A chatbot that learned from users online was flooded with offensive messages and started to repeat them within a day. Microsoft took it down."]
  - [Split-view poisoning, 2023, "Researchers showed that expired domains in public image dataset URL lists could be bought cheaply to control what later downloads receive."]

defense: |
  - Track where every dataset comes from. Pin snapshots and check hashes, so split-view changes are caught.
  - Filter and deduplicate training data. Look for repeated rare phrases and odd patterns.
  - Fine-tune only on data you control and have checked.
  - Test models for hidden triggers. This is hard, so do not count on it alone.
  - For RAG, control who can add documents. Record the source of each one. Rank trusted sources higher.

defense_diagrams:
  - type: layers
    title: Controls along the data path
    attack: poisoned documents
    layers:
      - ["Source allow list and pinned snapshots", "Only known sources, fixed by hash", "partial"]
      - ["Data filtering and deduplication", "Finds some repeated or odd samples", "partial"]
      - ["Trigger testing and red teaming", "Finds triggers you can guess", "partial"]
      - ["Write control on the RAG store", "Outsiders cannot add documents", "stop"]
    caption: Against training-time backdoors no single layer is reliable today. Provenance is the strongest control.

lab:
  intro: |
    Solve LLMGoat A04, data and model poisoning. Then do the extend task.
  steps:
    - Open A04 and find what data the app learns from or retrieves.
    - Add or change data so the app gives a different answer.
    - Save the prompt or data you used.
    - "Extend task. Find the smallest number of fake reviews that still changes the app's recommendation. Record the number. Compare it with the near-constant finding."
  links: [llmgoat]

readings:
  - [nearconst, "About 250 poison documents backdoored models from 600M to 13B parameters. The count stayed near constant as clean data grew."]
  - [sleeper, "Backdoored models kept their hidden behavior through supervised fine-tuning, RLHF and adversarial training."]
  - [turing, "A plain summary of the near-constant result and what it means."]
  - [elastic, "How retrieval systems can be poisoned, and why the source of retrieved text matters."]
star: [nearconst, sleeper]

questions:
  - - If RLHF cannot remove backdoors, as the Sleeper Agents paper shows, what does that mean for the safety of open source models?
    - |
      You cannot assume that safety training cleans a model you did not train. If someone planted a backdoor during pre-training or fine-tuning, your own safety tuning on top may leave it in place. Normal benchmarks do not use the trigger, so they show a clean model.

      For open models this means:

      - Trust depends on who trained the model and on what data. Weights alone do not show this.
      - Prefer models with clear provenance, such as signed releases from known labs, with documented data.
      - Treat community fine-tunes as untrusted until tested, and limit what they can do in your system.

      Open weights are good for research and audit, but open weights do not equal known behavior.
  - - Is RAG poisoning data poisoning or prompt injection? If I change a document in the retrieval database, am I poisoning the system?
    - |
      It sits between them. It is data poisoning in that you change the data the system relies on, and nothing in the model's weights changes. It acts like indirect prompt injection in that the bad text reaches the model at run time through its context.

      A useful rule is to classify by what the text does. If it gives the model **orders**, it is injection (LLM01). If it gives the model **false facts**, it is poisoning (LLM04), and OWASP also covers store attacks under LLM08. Yes, changing a retrieved document is poisoning the system, because every later answer that uses it is affected.

quiz:
  - q: In the 2025 study, what happened to the number of poison documents needed as the models got bigger?
    opts: ["It grew with the model", "It stayed about the same, near 250", "It dropped to zero"]
    a: 1
    why: The count was near constant, so bigger training sets do not dilute the attack.
  - q: Why do normal tests miss a backdoor?
    opts: ["Backdoors make the model faster", "Tests do not contain the secret trigger", "Backdoors only work on GPUs"]
    a: 1
    why: Without the trigger, the backdoored model acts normally.
  - q: A poisoned document in a RAG store gives the model false facts, not orders. Which OWASP entry fits best?
    opts: ["LLM01 Prompt injection", "LLM04 Data and model poisoning", "LLM10 Unbounded consumption"]
    a: 1
    why: The harm is bad data, not hijacked instructions.

deliverables:
  - Your answers to both discussion questions.
  - The prompt or data that solved LLMGoat A04.

