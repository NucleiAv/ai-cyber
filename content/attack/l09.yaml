star: [agentsec]

questions:
  - - Why are OAuth scopes often too broad for AI? A scope might be Gmail.Read, but we want the agent to read only travel emails. How do we build semantic permissions with a policy engine that checks the content of the tool call?
    - |
      OAuth answers "who may use which API". It was built for apps where a person decides what to do with the data. An agent decides by itself, and it can be steered by any email it reads. A scope like Gmail.Read gives it the whole inbox for a task that needs only travel receipts.

      **Semantic permissions** describe intent, such as "read emails about travel bookings". To enforce them:

      1. Put a policy engine between the agent and the mail API. Every call goes through it.
      2. Use deterministic rules where you can, such as a label filter, a sender allow list or a date range.
      3. For meaning-based rules, use a separate classifier or a small LLM judge that sees only the email metadata and the task, and returns allow or deny. Log its decisions.
      4. Deny by default. Send unclear cases to a person.

      The engine checks **what** the agent asks for, not only **who** the agent is.

quiz:
  - q: An agent that only summarizes tickets also has a delete_ticket tool. Which cause of excessive agency is this?
    opts: ["Excessive functionality", "Excessive autonomy", "Misinformation"]
    a: 0
    why: The tool is not needed for the task at all.
  - q: In the agent loop, which step is the right place for a permission check?
    opts: ["Inside the model's prompt", "Where the app runs the tool", "After the task ends"]
    a: 1
    why: The app runs the tool, so code there can block a bad call whatever the model wrote.
  - q: What makes an agent a confused deputy?
    opts: ["It uses a small model", "It uses the user's real permissions for an attacker's goal", "It runs too slowly"]
    a: 1
    why: The attacker borrows the user's power through the agent.

