questions:
  - - When a developer downloads llama-2-7b from Hugging Face, what guarantee do they have that the weights were not tampered with?
    - |
      Few guarantees, and they depend on how the model is pulled.

      - **The name.** You trust that the namespace still belongs to Meta. Namespace reuse shows that a name can change owners.
      - **The file hash.** The hub shows a hash for each file. It proves the file did not change after upload. It does not prove the uploaded file was safe.
      - **The format.** Official Llama releases use safetensors, which cannot run code on load. Many community copies and fine-tunes still ship pickle files.
      - **The behavior.** Nothing proves the weights act as claimed. A poisoned or edited model looks normal on most tests.

      For the official release in safetensors, pinned to a revision, with checked hashes, the risk is low. For community copies, there is little guarantee. Signing and provenance, covered in lesson 6, are the way to get more.

quiz:
  - q: What does weights_only=True do in torch.load?
    opts: ["Loads only tensors and safe types, so pickle cannot call functions", "Makes loading faster", "Removes the model's bias"]
    a: 0
    why: It limits what the unpickler may build. It is the default since PyTorch 2.6.
  - q: Which file format cannot run code when loaded?
    opts: [".pth with pickle", "safetensors", ".bin with pickle"]
    a: 1
    why: safetensors stores only raw tensors and a small header.
  - q: How do you defend against model namespace reuse?
    opts: ["Use a bigger model", "Pin the exact revision or hash and mirror approved models", "Turn off the GPU"]
    a: 1
    why: A pinned revision cannot change when the name changes owner.

