slug: l01
num: "01"
lecture: 1
week: 1
short: Introduction to LLM security
title: Introduction to LLM security
time: about 3 hours
lede: What is different about attacking a system that reads and writes language, and the map of attacks you will learn in this track.
owasp: []
atlas: [AML.T0051, AML.T0054, AML.T0020, AML.T0137.003]
other_fw:
  - [NIST AI 100-2 E2025, "Splits attacks on AI into evasion, poisoning, privacy and misuse attacks, and adds a separate group for generative AI. [Read it](@nist1002)."]

idea: |
  A normal program follows exact rules. An LLM app follows **text**. It reads your words, the developer's words, and any document it is given, and then it writes the most likely next words.

  This makes it useful. It also gives the attacker a new way in. The attacker does not need a memory bug or a stolen password. The attacker needs only the right **words** in the right place.

  !eli5 Think of a very helpful new employee who reads every note on the desk and does what the notes say. The employee cannot tell a note from the boss from a note that a stranger slipped under the door. Most attacks in this track are a version of that note.

terms:
  - [LLM, "Large language model. A model trained on a large amount of text that predicts the next token."]
  - [Token, "A small piece of text, often a short word or part of a word. The model reads and writes tokens."]
  - [System prompt, "Hidden instructions from the developer, such as the bot's role and rules."]
  - [Prompt injection, "Text that makes the model do something the developer did not plan."]
  - [Jailbreak, "A type of prompt injection that makes the model ignore its safety training."]
  - [Training data, "The text the model learned from. It can hold private data that the model memorized."]
  - [Attack surface, "Every place where an attacker can put input into a system."]
  - [CTF, "Capture the flag. A practice game where you attack a test system to find a secret flag."]

how: |
  An LLM app is more than the model. It is a chain of parts. Each part is a place to attack.

  1. **Training.** The model learns from huge text collections. If an attacker can add text here, the model can learn a hidden behavior. This is poisoning.
  2. **The model file.** People download models from hubs. A model file can carry code that runs when it loads. This is a supply chain attack.
  3. **The prompt.** At run time the app joins the system prompt, the user text and other content into one long text. Any part an attacker controls can carry instructions. This is prompt injection.
  4. **The output.** The app shows the answer or passes it to a browser, a database or a tool. Unchecked output can carry an attack forward.
  5. **The actions.** Agents call tools. If the model is fooled, the tools do real damage.

  The survey you read this week sorts attacks into two big groups. **Security attacks** change what the model does, for example prompt injection, jailbreaking, backdoors and poisoning. **Privacy attacks** take information out of the model, for example training data extraction and PII leakage.

  !fact The OWASP Top 10 for LLM Applications 2025 is the list most teams use. The 14 lessons of this track follow it in order, from LLM01 prompt injection to LLM10 unbounded consumption.

