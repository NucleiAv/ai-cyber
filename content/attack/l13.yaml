star: [hai]

questions:
  - - If you translate watermarked English text to French and back, the watermark is likely gone. Is watermarking a long-term answer for provenance, or a speed bump? Compare C2PA signatures with statistical watermarks.
    - |
      For text, watermarking is mostly a speed bump today. Text watermarks bias word choices. Paraphrasing, translation or a rewrite by another model removes the bias. Image watermarks such as SynthID are more robust to small edits, but strong edits can still weaken them.

      **C2PA** works differently. It attaches a signed manifest. If present and valid, it proves the record was not changed. But it is easy to strip, for example by a screenshot.

      So they fail in different ways. A watermark lives inside the content but can be washed out. A signature is exact but can be removed. Use both, plus platform labels and detection, and treat missing marks as "unknown", not as "human made".
  - - How does the EU AI Act handle transparency for AI-generated content?
    - |
      Article 50 sets transparency duties.

      - Providers of systems that generate synthetic audio, images, video or text must mark the output in a machine-readable format so it can be detected as AI-generated, as far as technically feasible.
      - Deployers who publish deepfakes must disclose that the content was generated or changed by AI.
      - AI-generated text published to inform the public on matters of public interest must be disclosed, unless a human reviewed it and an editor takes responsibility.
      - People must be told when they interact with an AI system, unless it is obvious.

      The roadmap page lists the current dates for these duties.

quiz:
  - q: A model gives the same wrong answer in five runs. What does that show?
    opts: ["The answer is true", "The model is consistent, not correct", "The model is broken"]
    a: 1
    why: Agreement across runs measures memory, not truth. Module 5 shows a stale fact repeated five times.
  - q: Which provenance method is lost when someone takes a screenshot of an image?
    opts: ["C2PA metadata", "Nothing is lost", "A strong pixel watermark is always lost"]
    a: 0
    why: Screenshots make a new file without the original metadata.
  - q: What is the best defense against slopsquatting?
    opts: ["Trust the assistant", "Check that a package is real and approved before installing", "Use a faster package manager"]
    a: 1
    why: Lock files record what you installed. They do not tell you a new package is safe.

deliverables:
