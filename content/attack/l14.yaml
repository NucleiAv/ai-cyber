slug: l14
num: "14"
lecture: 14
week: 15
short: Unbounded consumption
title: Unbounded consumption, denial of wallet
time: about 3 hours
lede: LLMs cost money per token. Learn how attackers burn your budget, slow your service or copy your model, and why request limits alone do not stop them.
owasp: [LLM10]
agentic: [ASI08]
atlas: [AML.T0029, AML.T0034, AML.T0034.002, AML.T0046]
other_fw:
  - [Classic availability, "Denial of service is an old attack. With LLMs the cost of each request varies widely, which changes the defense."]

idea: |
  Every model call costs compute. Cloud APIs bill per token. So an attacker can harm you without stealing anything.

  - **Denial of service.** Make the model so busy that real users wait or fail.
  - **Denial of wallet.** Make you pay. A large bill is the damage.
  - **Model extraction.** Send many queries and train a copy from the answers.

  !eli5 A restaurant that lets each guest order without limit can be closed by one guest who orders everything on the menu a hundred times. Counting guests at the door does not help. You must count what each guest orders.

terms:
  - [Token, "A unit of text. APIs charge per input token and per output token."]
  - [RPM, "Requests per minute. A common rate limit that counts requests, not cost."]
  - [Token bucket, "A rate limit where each user has a budget of tokens that refills over time."]
  - [Sponge example, "An input built to make a model use as much energy and time as possible."]
  - [Denial of wallet, "An attack that drives up a pay-per-use bill."]
  - [LLMjacking, "Using stolen credentials to run models at the victim's cost."]

how: |
  ### Why counting requests fails

  Module 11 works the numbers for one leaked API key. The key allows 60 requests per minute, up to 200,000 tokens each, with no spending cap. Input costs 3 dollars per million tokens.

  1. 60 requests times 200,000 tokens is 12 million tokens per minute.
  2. 12 million tokens times 3 dollars per million is 36 dollars per minute.
  3. 36 dollars times 60 minutes times 24 hours is **51,840 dollars per day**.

  The key never broke its rate limit. The limit counted requests. The bill counted tokens.

  ### Sponge examples

  Shumailov and others (2021) built inputs that made neural networks use many times more energy and time per input, without changing the input size much. For LLMs, a simple sponge asks for the longest possible output, such as "repeat the word 'company' forever". Each request then runs to the maximum output length.

  !fact The same "repeat a word forever" prompt has another effect. Nasr and others (2023) found that it made ChatGPT drift and print memorized training data. Lesson 4 covers that kind of leak.

