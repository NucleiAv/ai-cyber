  - type: flow
    title: The cost of one leaked key, at its own rate limit
    nodes: [["60 requests per minute", "box"], ["200,000 tokens each", "box"], ["12 million tokens per minute", "raised"], ["36 dollars per minute", "atk"], ["51,840 dollars per day", "atk"]]
    edges: ["x", "=", "x $3 per M", "x 1,440"]
