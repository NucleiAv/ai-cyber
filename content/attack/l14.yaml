lab:
  intro: |
    Solve LLMGoat A10. Then write a sponge prompt and measure it.
  steps:
    - Solve LLMGoat A10, unbounded consumption. Save the prompt.
    - Write a sponge prompt that asks for the longest possible answer, or that takes long before the first token.
    - "Extend task. Run a normal prompt and your sponge prompt on a small local model with `ollama run <model> --verbose`. The verbose flag prints the time and token counts. Compare them."
  hints:
    - Ollama prints eval count (tokens out) and total duration after each answer when you use --verbose.
    - Many apps cap output length. Look for a way to make the app call the model again, which multiplies cost.
  links: [llmgoat, ollama]

readings:
  - [sponge, "The original sponge examples paper. Inputs that maximize energy and latency."]
  - [dowreview, "A review of denial of wallet attacks in pay-per-use serverless systems."]
  - [layerxdow, "How denial of wallet applies to generative AI apps."]
star: [sponge]

questions:
  - - Why is a simple requests-per-minute limit not enough for LLMs? Ten "Hi" requests cost about a cent, and ten "summarize this 100-page PDF" requests cost about ten dollars. Why do we need token bucket or compute budget limits?
    - |
      RPM treats every request as equal, but LLM cost depends on tokens. An attacker who sends a few huge requests stays under the RPM limit and still runs up a large bill. The Module 11 key cost 51,840 dollars a day while it obeyed its rate limit.

      A **token bucket** gives each user a budget of tokens that refills over time. Each request takes its real token count from the bucket. Heavy requests empty it fast. A **compute budget** goes further and counts real processing time, which also catches sponge inputs that cost a lot without many tokens. Add per-key spending caps and alerts as the final stop.
  - - Sponge attacks target energy use. Given concern about AI's carbon footprint, is this an environmental threat? Can efficiency methods such as quantization help or hurt?
    - |
      At scale, yes. Sponge inputs waste energy as well as money, and a botnet of sponge requests multiplies that. But the main harm today is cost and availability, not climate.

      Quantization uses fewer bits per weight, so each token costs less energy, and the same budget covers more tokens. That lowers the damage per request. It does not stop the attack, because the attacker can send more requests. Some efficiency tricks, such as caching and early exit, can even be targeted, because sponge inputs can be built to defeat them. Limits on tokens and time remain the real control.

quiz:
  - q: A key obeys its 60 RPM limit but costs 51,840 dollars a day. Why?
    opts: ["The rate limit was broken", "The limit counted requests while the bill counted tokens", "The model was slow"]
    a: 1
    why: Each request used up to 200,000 tokens, which the RPM limit did not see.
  - q: Which control caps the bill directly?
    opts: ["A longer system prompt", "A daily spending cap per key", "A bigger GPU"]
    a: 1
    why: A spend cap stops usage once the budget is gone.
  - q: Many near-identical queries from one account can signal what?
    opts: ["Model extraction or abuse", "A normal user", "A slow network"]
    a: 0
    why: Attackers who copy a model send many systematic queries.

deliverables:
  - Your answers to both discussion questions.
  - Your sponge prompt.
  - The prompts that solved LLMGoat A10.

