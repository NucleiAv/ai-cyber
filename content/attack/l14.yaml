attack_steps:
  - Find an endpoint or a key with no spending cap. Leaked keys in public code are common.
  - Send requests that maximize tokens, such as long inputs and prompts that ask for endless output.
  - Spread requests over many accounts or keys to stay under per-account limits.
  - For agents, trigger loops, such as tasks that make the agent call tools again and again.

cases:
  - [LLMjacking, 2024, "Sysdig reported attackers who used stolen cloud credentials to run hosted models at the victims' cost, and estimated over 46,000 dollars per day for one victim."]
  - [Operation Bizarre Bazaar, "Pillar Security reported stolen access to AI endpoints resold on a marketplace."]

defense: |
  - Limit **tokens** and **cost**, not only requests. Use a token bucket per user and per key.
  - Cap input size and set a maximum output length for every call.
  - Set per-key daily spending caps that alert and then stop.
  - Add timeouts and step limits for agents.
  - Alert on spikes in tokens per user and on many near-identical queries, which can signal model extraction.
  - Keep keys out of code. Rotate them, and scan repositories for leaks.

defense_diagrams:
  - type: layers
    title: Stopping a denial of wallet attack
    attack: max-token flood
    layers:
      - ["Requests-per-minute limit", "Counts calls, not cost", "pass"]
      - ["Max input and output tokens per call", "Each call has a ceiling", "partial"]
      - ["Token bucket per user and key", "Heavy users run out fast", "stop"]
