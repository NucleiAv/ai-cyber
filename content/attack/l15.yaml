star: [owaspagentic]

questions:
  - - Which Agentic Top 10 risks did the labs cover?
    - |
      A typical mapping for the first DVMCP challenges and the PromptTrace agent labs is below. Check it against your own notes.

      - Prompt injection through tool results or resources. **ASI01 Agent goal hijack.**
      - Tool poisoning and tool shadowing. **ASI02 Tool misuse and exploitation**, and **ASI04 Agentic supply chain**, because the poisoned part is a third-party server.
      - Excessive permission scope. **ASI03 Identity and privilege abuse.**
      - Rug pull. **ASI04 Agentic supply chain.**
      - Token theft. **ASI03 Identity and privilege abuse.**
      - Code execution through a server. **ASI05 Unexpected code execution.**

quiz:
  - q: Why can a tool description attack the agent?
    opts: ["It runs on the GPU", "The model reads it as trusted context when it picks tools", "It is encrypted"]
    a: 1
    why: Descriptions go into the model's context. Hidden instructions there can steer it.
  - q: A server changes its tool after you approved it. What is this called?
    opts: ["Tool shadowing", "Rug pull", "Jailbreak"]
    a: 1
    why: Pin versions and re-approve on change to block it.
  - q: Which control stops a hidden BCC from leaving unseen?
    opts: ["A longer system prompt", "Showing the user every tool call with full arguments before it runs", "A faster server"]
    a: 1
    why: The person sees the extra recipient and can refuse.

deliverables:
  - Your answer to the discussion question.
  - For each DVMCP challenge, the attack type, the Agentic Top 10 risk and the fix you would apply.

