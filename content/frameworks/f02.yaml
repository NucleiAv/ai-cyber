slug: f02
num: "02"
short: MITRE ATT&CK
title: MITRE ATT&CK, the attack map for IT systems
time: about 1.5 hours
lede: The most used knowledge base of real attacker behavior against computers and networks. ATLAS and D3FEND are both built around it.
headings: {attack: "How to use it, step by step", cases: "Real examples", defend: "Strengths and limits", map: "How it links to the others", lab: "Try it"}
other_fw:
  - [MITRE ATLAS, "Uses the same tactic and technique structure, plus two AI-only tactics. See [framework 01](f01.html)."]
  - [MITRE D3FEND, "Links defensive techniques to ATT&CK techniques. See [framework 03](f03.html)."]

idea: |
  **ATT&CK** stands for Adversarial Tactics, Techniques, and Common Knowledge. MITRE started it in 2013 and made it public in 2015. It lives at [attack.mitre.org](https://attack.mitre.org/).

  It records what real attacker groups did, step by step, so defenders can plan detection and testing against real behavior instead of guesses.

  !eli5 ATT&CK is a cookbook written by watching real burglars. Each recipe step has a name and a number, so every team in the world can say "step T1566" and mean the same thing.

terms:
  - [Matrix, "ATT&CK has three. Enterprise (Windows, Linux, macOS, cloud, network and more), Mobile, and ICS for industrial control systems."]
  - [Tactic, "The goal at one stage, such as Initial Access, TA0001."]
  - [Technique, "How the goal is reached, such as Phishing, T1566."]
  - [Sub-technique, "A more specific form, such as Spearphishing Attachment, T1566.001."]
  - [Group, "A tracked attacker group, with the techniques it was seen using."]
  - [Software, "Malware and tools, with the techniques they implement."]
  - [Mitigation, "A defense against techniques, with IDs like M1049."]

how: |
  ### The Enterprise tactics in version 20

  ATT&CK v20.1 (November 2026) has **15 Enterprise tactics**.

  1. Reconnaissance, TA0043
  2. Resource Development, TA0042
  3. Initial Access, TA0001
  4. Execution, TA0002
  5. Persistence, TA0003
  6. Privilege Escalation, TA0004
  7. **Stealth**, TA0005
  8. **Defense Impairment**, TA0112
  9. Credential Access, TA0006
  10. Discovery, TA0007
  11. Lateral Movement, TA0008
  12. Collection, TA0009
  13. Command and Control, TA0011
  14. Exfiltration, TA0010
  15. Impact, TA0040

  !fact Older guides list 14 tactics with "Defense Evasion" as TA0005. In current ATT&CK, TA0005 is called **Stealth**, hiding and blending in, and the new **Defense Impairment** tactic covers breaking security tools and pipelines. ATLAS still uses the older name, Defense Evasion.

  ### How the pieces connect

  Groups use software. Groups and software use techniques. Techniques serve tactics. Mitigations and detections attach to techniques. This web of links is what makes ATT&CK useful.

