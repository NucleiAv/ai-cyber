attack_steps:
  - Pick threat groups that target your sector, from ATT&CK's group pages or your threat intel.
  - List the techniques those groups use.
  - Mark which of them your logs and tools can detect today. ATT&CK Navigator is a free tool that colors the matrix for you.
  - Fill the biggest gaps first with new logging or detection rules.
  - Test with adversary emulation, safely replaying the techniques in a lab, then repeat.

cases:
  - [Module 8 of the defend track, "Phishing maps to T1566 under Initial Access. The module also uses ATLAS for the AI-specific parts of the same attacks."]
  - [Detection engineering, "Most commercial detection tools and SIEM rule packs tag rules with ATT&CK IDs, so coverage can be compared."]

defense: |
  **Strengths**

  - Based on observed behavior, with thousands of public references.
  - The shared language of SOCs, red teams and vendors.
  - Free, with STIX data and tools such as Navigator.

  **Limits**

  - Coverage of a technique does not mean you detect every way it can be done.
  - It is not a priority list. Choose what matters with threat intel and risk.
  - It changes with each release. Record the version you used.

lab:
  intro: |
    Build a small coverage map.
  steps:
    - Open ATT&CK Navigator in your browser (a free MITRE tool linked from the ATT&CK site).
    - Create a new Enterprise layer.
    - Color five techniques you could detect with the tools you know, such as T1566 Phishing.
    - Color five you could not.
    - Write one line per gap on what log source would close it.

quiz:
  - q: In ATT&CK v20, what is TA0005 called?
    opts: ["Defense Evasion", "Stealth", "Defense Impairment"]
    a: 1
    why: TA0005 is now Stealth. The new tactic TA0112 is Defense Impairment. Older material still says Defense Evasion.
  - q: What does a technique describe?
    opts: ["Why the attacker acts", "How the attacker reaches a goal", "Which company was attacked"]
    a: 1
    why: Tactics are goals, techniques are methods.
  - q: Your SIEM detects one way of doing T1566. Is T1566 fully covered?
    opts: ["Yes", "No, a technique can be done in many ways"]
    a: 1
    why: Coverage maps are a starting point. Test each variant you care about.

